<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
    <meta name="apple-mobile-web-app-title" content="番鼠农场">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>番鼠农场（单文件版）</title>
    <style>
      :root{
        color-scheme: light;
        --bg:#8ec9ee; --surface:#fbebc0; --text:#4a2c14; --dim:#8a6a45;
        --border:#6b3f1d; --accent:#5da33c; --wood:#6b3f1d; --wood-dark:#4a2c14;
        --cream:#fbebc0; --cream-light:#fff6da; --gold:#ffd83d;
      }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;}
      body{
        background:linear-gradient(180deg,#8ec9ee 0,#a8d8f0 110px,#7cb45a 110px,#679c46 100%);
        background-attachment:fixed;
        color:var(--text);
        font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
        font-size:15px; line-height:1.5;
      }
      body[data-skin="skin_spring"]{background:linear-gradient(180deg,#f6c9dc 0,#fbe3ee 110px,#9ccb72 110px,#83b45c 100%);background-attachment:fixed;}
      body[data-skin="skin_summer"]{background:linear-gradient(180deg,#5db1e8 0,#8fd0f5 110px,#58a848 110px,#478c38 100%);background-attachment:fixed;}
      body[data-skin="skin_autumn"]{background:linear-gradient(180deg,#f2b25c 0,#f8d193 110px,#c9903e 110px,#a9762e 100%);background-attachment:fixed;}
      body[data-skin="skin_winter"]{background:linear-gradient(180deg,#cfdff0 0,#e8f1f8 110px,#eef4f8 110px,#dbe7ef 100%);background-attachment:fixed;}
      body[data-skin="skin_spring"] .app-header,body[data-skin="skin_spring"] .app-sidebar,body[data-skin="skin_spring"] .app-drawer{background:linear-gradient(180deg,#a05a68,#7e3e4e)!important;}
      body[data-skin="skin_summer"] .app-header,body[data-skin="skin_summer"] .app-sidebar,body[data-skin="skin_summer"] .app-drawer{background:linear-gradient(180deg,#2e7a6e,#1f5a50)!important;}
      body[data-skin="skin_autumn"] .app-header,body[data-skin="skin_autumn"] .app-sidebar,body[data-skin="skin_autumn"] .app-drawer{background:linear-gradient(180deg,#a05a1e,#7a3f14)!important;}
      body[data-skin="skin_winter"] .app-header,body[data-skin="skin_winter"] .app-sidebar,body[data-skin="skin_winter"] .app-drawer{background:linear-gradient(180deg,#5a7a9a,#42586e)!important;}

      .font-pixel{font-family:"DotGothic16","Courier New","Microsoft YaHei",monospace;letter-spacing:.02em;font-weight:700;}
      .font-num{font-family:"Courier New",monospace;font-weight:700;letter-spacing:.02em;}
      .wood-panel{background:linear-gradient(180deg,#fbebc0,#f7dd9a);border:3px solid #4a2c14;outline:3px solid #6b3f1d;outline-offset:-6px;box-shadow:4px 4px 0 rgba(46,26,8,.55);border-radius:4px;}
      .paper-panel{background:#fff6da;border:2px solid #4a2c14;box-shadow:3px 3px 0 rgba(46,26,8,.45);border-radius:3px;}
      .wood-sign{background:linear-gradient(180deg,#8a5a2b,#6b3f1d);border:3px solid #4a2c14;box-shadow:3px 3px 0 rgba(46,26,8,.5);border-radius:4px;color:#ffe9a8;text-shadow:1px 1px 0 #3a2110;}
      .quest-paper{position:relative;overflow:hidden;}
      .quest-paper::before{content:"";position:absolute;top:3px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9d8a,#d43a25 70%);border:2px solid #8c2313;box-shadow:0 2px 2px rgba(74,44,20,.35);z-index:1;}
      .quest-overdue{filter:grayscale(.75);}
      .quest-overdue::after{content:"";position:absolute;right:0;bottom:0;width:26px;height:26px;background:linear-gradient(315deg,transparent 49%,#cbb98d 50%,#a98f57 100%);border-left:2px solid #8a6a45;border-top:2px solid #8a6a45;}
      .extra-pt{padding-top:24px;}

      .pix-btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:40px;padding:6px 14px;background:linear-gradient(180deg,#ffe9a8,#f5c56b);border:2px solid #4a2c14;border-radius:3px;box-shadow:0 3px 0 #4a2c14;color:#4a2c14;font-weight:600;font-size:14px;cursor:pointer;user-select:none;touch-action:manipulation;font-family:inherit;text-decoration:none;}
      .pix-btn:active{transform:translateY(3px);box-shadow:0 0 0 #4a2c14;}
      .pix-btn:disabled{opacity:.5;pointer-events:none;}
      .pix-btn-green{background:linear-gradient(180deg,#a5d66d,#5da33c);color:#fff6da;text-shadow:1px 1px 0 #2f5a1c;}
      .pix-btn-red{background:linear-gradient(180deg,#f2a49b,#d95f52);color:#fff6da;text-shadow:1px 1px 0 #7c241c;}
      .pix-btn-blue{background:linear-gradient(180deg,#bde3fb,#7ec8f7);}
      .pix-btn-ghost{background:#fff6da;box-shadow:0 2px 0 #4a2c14;min-height:34px;padding:4px 10px;font-size:13px;}
      .pix-btn-sm{min-height:34px;font-size:13px;padding:4px 10px;}
      .pix-tag{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;background:#ffe9a8;border:2px solid #4a2c14;border-radius:3px;font-size:12px;font-weight:600;line-height:18px;white-space:nowrap;}
      .pix-tag-green{background:#cdeeb2;} .pix-tag-blue{background:#cdeafd;} .pix-tag-pink{background:#fbe0ec;}
      .pix-tag-red{background:#f8cfc9;} .pix-tag-gray{background:#e8e0cd;color:#8a6a45;}
      .pix-input{width:100%;min-height:40px;padding:7px 10px;background:#fffdf2;border:2px solid #4a2c14;border-radius:3px;font-size:15px;color:#4a2c14;outline:none;font-family:inherit;}
      .pix-input:focus{box-shadow:0 0 0 2px #ffd83d;}
      textarea.pix-input{min-height:76px;resize:vertical;}
      .slot-cell{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#e9d193;border:2px solid #8a6a45;box-shadow:inset 2px 2px 0 rgba(255,255,255,.55),inset -2px -2px 0 rgba(74,44,20,.25);border-radius:2px;cursor:pointer;padding:4px;text-align:center;overflow:hidden;}
      .slot-cell.done{background:#b9dd8f;}
      .slot-cell.empty{background:rgba(233,209,147,.45);cursor:default;}

      /* layout */
      .app-header{position:sticky;top:0;z-index:80;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(180deg,#8a5a2b,#6b3f1d);border-bottom:3px solid #4a2c14;}
      .menu-btn{min-width:48px;min-height:48px;position:relative;z-index:2;}
      .hud-inner{max-width:1400px;margin:0 auto;padding:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;transition:padding .3s ease,gap .3s ease;}
      /* HUD 滚动收缩：下滑收成细条（只剩菜单/金币/积分/同步），回顶部展开；.hud-extra 是细条里隐藏的行 */
      .hud-extra{max-height:72px;transition:max-height .3s ease,max-width .3s ease,min-width .3s ease,opacity .22s ease,transform .3s ease,margin .3s ease,padding .3s ease,border-width .3s ease;}
      .app-header.hud-slim .hud-inner{padding-top:4px;padding-bottom:4px;gap:6px;}
      .app-header.hud-slim .hud-extra{max-height:0;max-width:0!important;min-width:0!important;flex:0 0 0!important;overflow:hidden;opacity:0;transform:scale(.8);margin:0!important;padding:0!important;border-width:0!important;box-shadow:none!important;pointer-events:none;}
      .app-header.hud-slim .sync-badge{font-size:11px;line-height:16px;padding:0 5px;}
      @media (min-width:900px){
        .app-sidebar{transition:top .3s ease;}
        body.hud-slim .app-sidebar{top:calc(38px + env(safe-area-inset-top,0px));}
      }
      @media (prefers-reduced-motion: reduce){
        .hud-inner,.hud-extra,.app-sidebar{transition:none!important;}
      }
      .shell{max-width:1400px;margin:0 auto;display:flex;align-items:flex-start;}
      .app-sidebar{display:none;}
      @media (min-width:900px){
        .app-sidebar{display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:flex-start;padding:8px;gap:2px;background:linear-gradient(180deg,#8a5a2b,#6b3f1d);border-right:3px solid #4a2c14;min-height:calc(100dvh - 64px - env(safe-area-inset-top,0px));}
        .menu-btn{display:none;}
        .brand-mobile{display:none;}
      }
      .app-main{flex:1;min-width:0;padding:12px 10px 44px;}
      @media (min-width:640px){.app-main{padding:12px 16px 44px;}}
      .app-main.workbg{background:linear-gradient(180deg,#c9a15e,#bd9250);min-height:calc(100dvh - 64px - env(safe-area-inset-top,0px));}
      .nav-btn{width:100%;display:flex;align-items:center;gap:8px;padding:8px;text-align:left;font-size:15px;font-weight:600;background:transparent;border:2px solid transparent;border-radius:3px;color:#f3dfba;text-shadow:1px 1px 0 #3a2110;min-height:44px;cursor:pointer;font-family:inherit;}
      .nav-btn.active{background:#ffe9a8;border-color:#4a2c14;color:#4a2c14;text-shadow:none;}
      .nav-btn.icononly{justify-content:center;}
      .nav-group-title{color:#ffd83d;text-shadow:1px 1px 0 #3a2110;padding:4px 8px 4px;}
      .fence{margin:8px 0;height:14px;position:relative;}
      .fence::before{content:"";position:absolute;left:0;right:0;top:6px;height:3px;background:#4a2c14;}
      .fence span{display:flex;justify-content:space-between;padding:0 4px;}
      .fence i{width:5px;height:14px;background:#8a5a2b;border:1px solid #4a2c14;display:block;}
      .drawer-wrap{position:fixed;inset:0;z-index:95;background:rgba(46,26,8,.55);}
      .app-drawer{position:absolute;left:0;top:0;bottom:0;width:248px;padding:calc(12px + max(env(safe-area-inset-top,0px),52px)) 12px calc(12px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));overflow-y:auto;background:linear-gradient(180deg,#8a5a2b,#6b3f1d);}
      @media (min-width:900px){.drawer-wrap{display:none;}}
      /* touch / small screens: force a 52px floor under the notch/Dynamic Island when the host reports a 0 safe-area inset */
      @media (max-width:899px), (hover:none) and (pointer:coarse){
        .app-header{padding-top:max(env(safe-area-inset-top,0px),52px);}
        .hud-inner{padding-right:52px;}
        .app-drawer{padding-top:calc(12px + max(env(safe-area-inset-top,0px),52px));}
      }
      /* 手机顶栏压缩（≤700px）：只保留 env 安全区下限（去掉 52px 硬下限），收紧间距与字号，目标总高约 72px；>700px 桌面与平板不受影响 */
      @media (max-width:700px){
        .app-header{padding-top:max(env(safe-area-inset-top,0px),10px);}
        .hud-inner{padding:4px 8px;gap:5px;}
        .brand-mobile{display:none!important;}
        .menu-btn{min-width:40px!important;min-height:38px!important;}
        #hud .wood-panel{padding:2px 6px!important;}
        #hud .wood-panel .font-pixel{font-size:13px!important;}
        #hud b.font-num{font-size:12px;}
        #hud>div.hud-extra:has(>div){max-width:110px!important;min-width:72px!important;}
        #hud [data-act="search-open"]{min-height:36px;}
        #hud [data-act="search-open"]>span{font-size:0;line-height:0;}
        .app-header .sync-badge{font-size:10px;line-height:15px;padding:1px 5px;}
      }

      .panel{padding:12px;}
      @media (min-width:640px){.panel{padding:16px;}}
      .panel h2{font-size:19px;margin:0 0 8px;display:flex;align-items:center;gap:8px;}
      .stack>*+*{margin-top:16px;}
      .row{display:flex;gap:8px;} .wrap{flex-wrap:wrap;} .items-center{align-items:center;}
      .grid2{display:grid;gap:16px;} @media (min-width:640px){.grid2{grid-template-columns:1fr 1fr;}}
      .grid-cards{display:grid;gap:12px;} @media (min-width:640px){.grid-cards{grid-template-columns:1fr 1fr;}}
      .grid-cards3{display:grid;gap:12px;grid-template-columns:1fr 1fr;} @media (min-width:640px){.grid-cards3{grid-template-columns:repeat(3,1fr);}}
      .grid-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
      .dim{color:var(--dim);} .small{font-size:13px;} .xs{font-size:12px;}
      .bar{height:12px;background:#e8dcc0;border:2px solid #4a2c14;}
      .bar>div{height:100%;transition:width .4s;}
      table.tbl{width:100%;border-collapse:collapse;font-size:14px;}
      table.tbl th{text-align:left;padding:6px 8px 6px 0;border-bottom:2px solid #4a2c14;}
      table.tbl td{padding:6px 8px 6px 0;border-bottom:1px dashed #b99b62;vertical-align:top;}
      .field{display:block;margin-bottom:12px;}
      .field>span{display:block;font-size:14px;font-weight:600;margin-bottom:4px;}
      .modal-wrap{position:fixed;inset:0;z-index:130;display:flex;align-items:flex-end;justify-content:center;padding:8px;background:rgba(46,26,8,.55);}
      @media (min-width:640px){.modal-wrap{align-items:center;padding:16px;}}
      .modal-box{width:100%;max-width:448px;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;padding:0;}
      .modal-box.wide{max-width:672px;}
      .modal-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 10px;background:linear-gradient(180deg,#fbebc0,#f7dd9a);border-bottom:2px solid rgba(74,44,20,.28);}
      .modal-body{padding:12px 16px 6px;}
      .modal-foot{position:sticky;bottom:0;z-index:2;display:flex;justify-content:flex-end;padding:10px 16px 12px;background:linear-gradient(180deg,#fbebc0,#f7dd9a);border-top:2px solid rgba(74,44,20,.28);}
      body.modal-open{overflow:hidden;}
      .iconpick{display:flex;gap:6px;flex-wrap:wrap;}
      .iconpick button{padding:6px;background:rgba(255,246,218,.6);border:2px solid #cbb98d;border-radius:3px;cursor:pointer;}
      .iconpick button.sel{background:#ffe9a8;border-color:#b8860b;}

      /* splash */
      .splash{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-start;justify-content:center;padding-top:env(safe-area-inset-top,0px);}
      #splash-enter:active{transform:translate(3px,3px);box-shadow:2px 2px 0 #3a2110 !important;}
      .auth-splash{z-index:95;}
      .sign-light{background:repeating-linear-gradient(180deg,rgba(122,68,22,.4) 0 2px,transparent 2px 26px),repeating-linear-gradient(180deg,#f7dc9e 0 13px,#f0cd82 13px 26px);border:5px solid #b06a28;outline:3px solid #7a4416;outline-offset:0;box-shadow:7px 7px 0 #8a5a1e;border-radius:0;color:#7a4416;}
      .sign-dark{background:repeating-linear-gradient(180deg,rgba(0,0,0,.45) 0 2px,transparent 2px 26px),repeating-linear-gradient(180deg,#6b3f1d 0 13px,#59300f 13px 26px);border:5px solid #2e1a08;outline:3px solid #59371a;outline-offset:0;box-shadow:7px 7px 0 #1d0f04;border-radius:0;color:#ffd83d;}
      .sign-white{background:repeating-linear-gradient(180deg,rgba(93,58,26,.3) 0 2px,transparent 2px 26px),repeating-linear-gradient(180deg,#faf3e0 0 13px,#eadfc4 13px 26px);border:5px solid #b8a888;outline:3px solid #8a7a58;outline-offset:0;box-shadow:7px 7px 0 #8a7a58;border-radius:0;color:#5d3a1a;}
      .sign-moss{background:repeating-conic-gradient(rgba(70,110,40,.45) 0 25%,transparent 0 50%) 7px 9px/18px 18px,repeating-linear-gradient(180deg,rgba(60,40,16,.35) 0 2px,transparent 2px 26px),repeating-linear-gradient(180deg,#a8874f 0 13px,#96793f 13px 26px);border:5px solid #4a5d24;outline:3px solid #66713a;outline-offset:0;box-shadow:7px 7px 0 #3d5220;border-radius:0;color:#fff6da;}
      .pix-letter{display:inline-block;line-height:0;}
      .pix-letter img{image-rendering:pixelated;display:block;}
      .sign-nail{position:absolute;width:7px;height:7px;background:#8a8f96;border:2px solid #5c6066;}

      @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
      .floaty{animation:floaty 2.6s ease-in-out infinite;}
      @keyframes starpop{0%{transform:scale(.4) rotate(-14deg);opacity:0;}60%{transform:scale(1.25) rotate(6deg);opacity:1;}100%{transform:scale(1) rotate(0);opacity:1;}}
      .starpop{animation:starpop .45s ease-out both;}
      @keyframes coinjump{0%{transform:translateY(0);}40%{transform:translateY(-6px);}100%{transform:translateY(0);}}
      .coinjump{animation:coinjump .5s ease-out;}
      @keyframes bannerin{0%{transform:translateY(-16px) scale(.92);opacity:0;}100%{transform:translateY(0) scale(1);opacity:1;}}
      .bannerin{animation:bannerin .3s ease-out both;}
      @keyframes bannerdown{0%{transform:translateY(-130%);opacity:0;}60%{transform:translateY(6px);opacity:1;}100%{transform:translateY(0);opacity:1;}}
      .bannerdown{animation:bannerdown .45s cubic-bezier(.2,.9,.3,1.2) both;}
      .banner-badge{background:linear-gradient(180deg,#fdf0bd,#f3d67c);border:3px solid #8a5a1e;box-shadow:inset 0 0 0 2px #fff3c4,0 2px 0 rgba(74,44,20,.35);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
      @keyframes signdrop{0%{transform:translateY(-46vh) rotate(0);opacity:0;}45%{transform:translateY(0) rotate(2.6deg);opacity:1;}65%{transform:rotate(-1.8deg);}82%{transform:rotate(.9deg);}100%{transform:rotate(0);}}
      .signdrop{transform-origin:50% -30%;animation:signdrop 1.25s cubic-bezier(.3,.7,.4,1) both;}
      @keyframes signsway{0%,100%{transform:rotate(.9deg);}50%{transform:rotate(-.9deg);}}
      .signsway{transform-origin:50% -30%;animation:signsway 5.5s ease-in-out 1.3s infinite;}
      @keyframes signenter{0%{transform:translateY(0) rotate(0);}30%{transform:translateY(16px) rotate(2.4deg);}55%{transform:translateY(4px) rotate(-1.6deg);}75%{transform:rotate(.8deg);}100%{transform:rotate(0);}}
      .signenter{transform-origin:50% -30%;animation:signenter .9s cubic-bezier(.3,.7,.4,1) both;}
      @keyframes splashout{to{opacity:0;visibility:hidden;}}
      .splashout{animation:splashout .45s ease-in .6s both;}
      @media (prefers-reduced-motion: reduce){
        .floaty,.starpop,.coinjump,.bannerin,.bannerdown,.signdrop,.signsway,.signenter,.splashout{animation:none;}
      }
      .pixelated{image-rendering:pixelated;}
      body.locked{overflow:hidden;}
      body.locked > header, body.locked > .shell, body.locked #companion-root{visibility:hidden;}
      .scroll-thin::-webkit-scrollbar{height:6px;width:6px;}
      .scroll-thin::-webkit-scrollbar-thumb{background:#6b3f1d;}
      .banner-slot{position:fixed;left:0;right:0;top:calc(68px + env(safe-area-inset-top,0px));z-index:70;display:flex;justify-content:center;pointer-events:none;padding:0 12px;}
      .banner-card{pointer-events:auto;display:flex;align-items:stretch;text-align:left;padding:0;overflow:hidden;width:min(430px,94vw);cursor:pointer;font-family:inherit;color:var(--text);}
      #companion{position:fixed;z-index:40;touch-action:none;}
      .bubble{background:#fff6da;border:2px solid #4a2c14;box-shadow:3px 3px 0 rgba(46,26,8,.45);border-radius:3px;position:absolute;width:256px;padding:12px;}
      .strike{text-decoration:line-through;}
      .news-head{border-bottom:4px solid #3a6ea8;padding-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
      .mood-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:430px;margin:0 auto;}
      .mood-cell{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;background:rgba(255,246,218,.55);border:3px solid #cbb98d;border-radius:4px;cursor:pointer;font-family:inherit;color:var(--text);}
      .mood-cell.sel{background:#ffe9a8;border-color:#b8860b;}
      .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
      .cal-cell{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 0;min-height:52px;background:rgba(255,246,218,.6);border:2px solid #d8c491;border-radius:3px;cursor:pointer;font-family:inherit;color:var(--text);}
      .cal-cell.today{background:#ffe9a8;border-color:#b8860b;}
      .cal-week{display:grid;gap:10px;grid-template-columns:1fr;}
      @media (min-width:1100px){.cal-week{grid-template-columns:repeat(7,1fr);}}
      .cal-day{padding:10px;}
      .cal-day.today{outline:3px solid #b8860b;outline-offset:-3px;}
      .cal-mcell{min-height:68px;gap:1px;}
      .cal-row{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed #d8c491;flex-wrap:wrap;}
      .cal-row:last-child{border-bottom:0;}
      .cal-row[draggable="true"]{cursor:grab;}
      .cal-move{width:136px;padding:2px 6px;font-size:12px;min-height:30px;}
      .cal-dot{width:7px;height:7px;background:#b03a2e;border-radius:50%;display:inline-block;}
      .stat-chips{display:flex;gap:8px;flex-wrap:wrap;}
      .stat-chip{flex:1;min-width:70px;padding:8px;text-align:center;cursor:pointer;font-family:inherit;}

      #fx-layer{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden;}

      .fx-leaf{position:absolute;top:-12px;width:8px;height:8px;animation:fxfall 8s linear infinite;}

/* ============ 基础工具 ============ */
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function pad2(n){return String(n).padStart(2,"0");}
function todayStr(){var d=new Date();return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate());}
var WEEKDAYS=["日","一","二","三","四","五","六"];
function weekdayOf(ds){var p=ds.split("-").map(Number);return WEEKDAYS[new Date(p[0],p[1]-1,p[2]).getDay()];}
function seasonOf(ds){var p=ds.split("-").map(Number);var m=p[1],d=p[2];var season="冬",icon="snow";
  if(m>=3&&m<=5){season="春";icon="blossom";}else if(m>=6&&m<=8){season="夏";icon="sun";}else if(m>=9&&m<=11){season="秋";icon="leaf";}
  return {season:season,icon:icon,day:((d-1)%28)+1};}
function fmtYuan(cents){var v=cents/100;return v.toLocaleString("zh-CN",{minimumFractionDigits:0,maximumFractionDigits:2});}
function shiftDate(ds,n){var p=ds.split("-").map(Number);var dt=new Date(p[0],p[1]-1,p[2]+n);return dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate());}
function ymdOf(dt){return dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate());}
function daysInMonth(y,m0){return new Date(y,m0+1,0).getDate();}
function dowOf(ds){var p=ds.split("-").map(Number);return new Date(p[0],p[1]-1,p[2]).getDay();}
function daysUntil(today,due){if(!due)return null;var a=today.split("-").map(Number),b=due.split("-").map(Number);
  return Math.round((new Date(b[0],b[1]-1,b[2])-new Date(a[0],a[1]-1,a[2]))/86400000);}
function dueLabel(today,due){var d=daysUntil(today,due);if(d==null)return "无期限";if(d<0)return "已逾期 "+(-d)+" 天";if(d===0)return "今天到期";return "还剩 "+d+" 天";}
function urgencyLevel(today,due){var d=daysUntil(today,due);if(d==null)return null;if(d<=3)return "red";if(d<=7)return "orange";if(d<=14)return "yellow";return "normal";}
var URGENCY_STYLE={red:{bg:"#f8cfc9",border:"#b03a2e",text:"#8c2b20"},orange:{bg:"#fde3c2",border:"#d97c1e",text:"#8a4d0f"},yellow:{bg:"#fdf3c9",border:"#c9a227",text:"#6d5510"},normal:{bg:"#fff6da",border:"#4a2c14",text:"#4a2c14"}};
function plantStage(n){if(n<=0)return{icon:"seed",label:"种子"};if(n<=2)return{icon:"sprout",label:"发芽"};if(n<=6)return{icon:"seedling",label:"小苗"};if(n<=13)return{icon:"plant",label:"茁壮"};if(n<=24)return{icon:"bud",label:"开花"};return{icon:"bloom",label:"盛放"};}
function weekStartOf(ds){var p=ds.split("-").map(Number);var dt=new Date(p[0],p[1]-1,p[2]);var dow=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-dow);return dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate());}
function uid(){return Date.now()*1000+Math.floor(Math.random()*1000);}

/* ============ 像素图标 / 立绘 / 心情小鸡 ============ */
function rectsSvg(rects,vb,size,h){
  var s='<svg width="'+size+'" height="'+(h||size)+'" viewBox="'+vb+'" shapeRendering="crispEdges" aria-hidden="true" focusable="false" style="flex-shrink:0;display:block">';
  for(var i=0;i<rects.length;i++){var r=rects[i];s+='<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+r[4]+'"/>';}
  return s+"</svg>";
}
function pixIcon(name,size){var r=ICONS[name]||ICONS.board||[];return rectsSvg(r,"0 0 16 16",size||22);}
var LEGACY_ICON_KEYS={};
function iconKeyOf(stored,fallback){if(!stored)return fallback||"gift";if(ICONS[stored])return stored;return LEGACY_ICON_KEYS[stored]||fallback||"gift";}

var JUNIMO_PAGES=["life","plan","review","memo","study","fitness","finance","habits","workToday","office","medical","cert","calendar","achievements","shop","profile","friends"];

function junimoSpotValid(sp){

/* 每日状态机：跨天重置并生成首个藏身点；进度满但奖励未落账时靠幂等键补发（不双发）。返回是否改动了状态 */
function junimoEnsureToday(){
  var today=todayStr();var j=S.junimo;var changed=false;
  if(!j||typeof j!=="object"||Array.isArray(j)){S.junimo={date:"",catches:0,spot:null,rewarded:false};j=S.junimo;changed=true;}
  if(j.date!==today){j.date=today;j.catches=0;j.rewarded=false;j.spot=null;changed=true;}
  if(typeof j.catches!=="number"||isNaN(j.catches)||j.catches<0){j.catches=0;changed=true;}
  if(j.catches>=3&&!j.rewarded){
    addLedger("points",5,"捉迷藏奖励",today,"junimo:"+today);
    j.rewarded=true;j.spot=null;changed=true;
  }
  if(j.rewarded){if(j.spot!==null){j.spot=null;changed=true;}}
  else if(!junimoSpotValid(j.spot)){j.spot=junimoGenSpot(null);changed=true;}
  return changed;
}

  var top="calc(112px + env(safe-area-inset-top,0px))",bot="calc(14px + env(safe-area-inset-bottom,0px))";
  switch(corner){
    case "tl":return "left:10px;top:"+top;
    case "tr":return "right:10px;top:"+top;
    case "bl":return "left:10px;bottom:"+bot;
    default:return "right:138px;bottom:"+bot; /* br：向左避开右下角的悬浮小人占位 */

}
var junimoFx=null,junimoHintTimer=null,junimoHintToken=0;
function renderJunimoLayer(){
  var root=document.getElementById("junimo-root");if(!root)return;
  if(junimoHintTimer){clearTimeout(junimoHintTimer);junimoHintTimer=null;}
  var token=++junimoHintToken;
  if(junimoFx){
    root.innerHTML='<div class="junimo-fx" style="'+junimoCornerStyle(junimoFx.corner)+'" aria-hidden="true"><span class="junimo-jump">'+junimoSvg(junimoFx.color,46)+'</span>'+junimoStarsHtml()+'</div>';
    return;
  }
  var j=S.junimo;
  if(!j||j.rewarded||(j.catches||0)>=3||!j.spot||j.spot.page!==ui.page||document.body.classList.contains("locked")){root.innerHTML="";return;}
  root.innerHTML='<button type="button" id="junimo" data-act="junimo-catch" aria-label="抓祝尼魔" style="'+junimoCornerStyle(j.spot.corner)+'">'+junimoSvg(j.spot.color,46)+'</button>';
  /* 停留超过 25 秒没点中：探头晃一下递个眼神，之后每 25 秒最多一次 */
  var armHint=function(){
    junimoHintTimer=setTimeout(function(){
      if(token!==junimoHintToken)return;
      var el=document.getElementById("junimo");
      if(el){el.classList.remove("junimo-peek");void el.offsetWidth;el.classList.add("junimo-peek");}
      armHint();
    },25000);
  };
  armHint();
}
function catchJunimo(){
  var j=S.junimo;
  if(!j||!j.spot||j.spot.page!==ui.page||j.rewarded||(j.catches||0)>=3)return;
  var fx={corner:j.spot.corner,color:j.spot.color};
  mutate(function(){
    j.catches=Math.min(3,(j.catches||0)+1);
    if(j.catches>=3){
      j.rewarded=true;j.spot=null;
      addLedger("points",5,"捉迷藏奖励",todayStr(),"junimo:"+todayStr());
      return [{icon:"star",title:"抓到祝尼魔啦（3/3）",sub:"+5 积分已到账，它回窝里休息了",small:true}];
    }
    j.spot=junimoGenSpot(j.spot.page); /* 强制换页，逼玩家逛页面 */
    return [{icon:"star",title:"抓到祝尼魔啦（"+j.catches+"/3）",sub:"它又躲到别的页面去了",small:true}];
  });
  junimoFx=fx;renderJunimoLayer();
  setTimeout(function(){if(junimoFx===fx){junimoFx=null;renderJunimoLayer();}},720);
}

function pickCharLineOwned(char,scene,seed,packOwned,pack2Owned,tmPackOwned){
  var base=CHAR_SCENE_LINES[char][scene]||CHAR_SCENE_LINES[char].daily;
  var pool=base;
  if(packOwned)pool=pool.concat(PACK_LINES[char]);
  if(pack2Owned)pool=pool.concat(PACK2_LINES[char]);
  if(tmPackOwned&&MERCHANT_PACK_LINES[char])pool=pool.concat(MERCHANT_PACK_LINES[char]);
  return pool[Math.abs(seed)%pool.length]||pool[0]||"";
}

  normal:{sebastian:["账记着呢，一笔一笔。……这种整齐，看着居然有点舒服。","钱去哪儿了，账本都写着。这点比我强，我的钱去哪儿了，永远是个谜。"],haley:["账本记得挺勤。会记账的人，买东西的眼光都不会差。……大概。","收支都明明白白的。好，今天的你，精致得很。"],linus:["账本清楚，心里就有底。像看星星，知道哪颗是哪颗。","一笔一笔，都是日子的脚印。记着，就不会走丢。"]}},
 habits:{urgent:{sebastian:["今天一株都没浇。……植物不会说话，但它们会记仇。大概。"],haley:["今天还没浇水？花都蔫给你看了。去点一下吧。"],linus:["今天的还没浇。去吧，一瓢水的事，像给篝火添一根柴。"]},
  empty:{sebastian:["花园是空的。……种点什么吧，我看浇水这种活儿，适合你。"],haley:["一株习惯都没种？种一株吧，看着它长，还挺有成就感的。"],linus:["花园还空着。种下第一颗种子吧，剩下的交给时间。"]},
  normal:{sebastian:["浇过了。……植物在长，你也在长。就这么回事。"],haley:["今天浇过水了。这花，长得比我的花园还精神。"],linus:["浇过水了。日子，就是这样一天一天，长出来的。"]}},
 workToday:{urgent:{sebastian:["今天有到期的，还有逾期的。……先把红的办了，剩下的我陪你看。","截止日期贴脸了。啧，成年人的鬼故事。先动手，别看它。"],haley:["今天到期的那几件，红得晃眼。办完它们，今天的妆才算化完。","逾期的先处理。拖着多难看，像我没卸干净的妆。快去。"],linus:["今天有几件到期了。像天边的乌云，早点进帐篷，就淋不着。","到期的事先办。办完了，今晚的星星看得才踏实。"]},
  empty:{sebastian:["工作那边一件不剩。……难得，你可以理直气壮地发呆了。","全清了。下班的路，今天走起来应该很轻。"],haley:["工作都清完了？那今天，可以早点下班打扮自己了。","一件不剩。效率高得……行吧，今天夸你两次了，这是上限。"],linus:["都办完了。好，剩下的时间，归你自己。","清单空了。像雨后的山路，干净。走吧，回家。"]},
  normal:{sebastian:["有几件在等。……一件一件来，天塌不下来。就算塌，我个子矮，先砸你。","今天的量还行。办完一件划一件，这种声音……还挺解压。"],haley:["今天这几件，慢慢办。办完最后一件，记得照照镜子，累丑了可不行。","待办摆在那儿呢。先挑顺眼的办，剩下的也就顺眼了。"],linus:["有几件事等着。像排队打汤，一个一个来，都有份。","一件一件办。山里的路再长，也是一步一步走完的。"]}},
 office:{urgent:{sebastian:["行政这边有要到期的了。……盖章买纸这种事，拖起来最要命。"],haley:["办公室的事拖着，整个屋子都显得乱。先清掉要到期的。"],linus:["屋里的事，也要及时收拾。像收帐篷，拖到下雨就麻烦了。"]},
  empty:{sebastian:["行政这边空了。……工位难得清净，享受吧。"],haley:["办公室的事都清完了？桌面终于能看了。"],linus:["屋里收拾干净了，心也跟着敞亮。"]},
  normal:{sebastian:["行政的活儿，不显眼，但缺了就乱套。……慢慢办吧。"],haley:["这些杂事办利索了，整个人都显得能干。继续。"],linus:["小事办稳了，大事才不慌。屋里的事，也是事。"]}},
 medical:{urgent:{sebastian:["医保有红透了的了。……别看了，先出门。这话我说第二遍了。","红成这样，再拖下去，窗口的人都要记住你了。先办最急的那件。"],haley:["医保那件红得跟警告牌一样。快去办，回来再抱怨天气。","都亮红灯了。材料带齐，妆可以淡，章不能少。去吧。"],linus:["医保的事，红了就是急了。像山雨欲来，先把这件办了，再回来喝汤。","逾期的那件，先去。路在脚下，一件归一件，别慌。"]},
  empty:{sebastian:["医保这边一件不剩。……窗口今天见不到你，他们该想你了。开玩笑的。","医保全清。难得。今天不用跑区，腿可以歇一天。"],haley:["医保都办完了？那今天不用跑窗口，鞋可以穿好看的那双了。","一件不剩。这个月跑区的次数，总算能歇一歇了。"],linus:["医保的事都清了。好，不用赶路的日子，就慢慢过。","这边空了。像办完事的傍晚，风都是闲的。"]},
  normal:{sebastian:["医保还有几件挂着。……按截止排，最急的在最上面。别装看不见。","几件医保在排队。办一件少一件。跑腿的命，认了吧。"],haley:["医保还有几件。挑同一天的，穿双好走的鞋，一次跑完。","这些医保事项，按日子排好了。最近的那件，先惦记着。"],linus:["医保的事，一件一件在等。像摘果子，先摘熟透的。","还有几件要跑。不急，按日子来，路不会跑掉。"]}},
 cert:{urgent:{sebastian:["办证有红了的。……证件这种事，过期一天，麻烦十天。先去。"],haley:["办证的那件亮红了。照片带了吗？证件照，可别拍得像我没睡醒的样子。"],linus:["办证的事拖不得。趁窗口还开着，先去一趟吧。"]},
  empty:{sebastian:["办证这边空了。……证件都齐全的人，走路都带风。大概。"],haley:["办证都清完了？证件齐全，心里不慌。"],linus:["办证这边没有事了。证件在抽屉里睡着，安心。"]},
  normal:{sebastian:["办证还有几件。……材料提前备齐，窗口只跑一趟。这是经验。"],haley:["几件办证排着队。地点都记好了？别白跑。"],linus:["办证的事，按日子慢慢来。材料备齐了，路就顺了。"]}},
 achievements:{urgent:{sebastian:["就差几枚了。……收集癖晚期。不过，看着满墙徽章，确实爽。"],haley:["快集齐了。最后一枚，可要挑个好看的日子解锁。"],linus:["徽章快满墙了。像星星，一颗一颗，攒成了银河。"]},
  empty:{sebastian:["一枚还没解锁。……没事，第一枚都是从『先干一件小事』开始的。"],haley:["徽章墙还空着。先拿一枚最容易的，挂上去开个张。"],linus:["墙上还空着。第一枚徽章，会在你办成第一件事时来。"]},
  normal:{sebastian:["已经挂了几枚了。……别看我，我的成就墙只有『活着』一项。"],haley:["这面墙，越来越有样子了。再添几枚，就能当背景拍照了。"],linus:["一枚一枚，都是日子留下的脚印。"]}},
 shop:{urgent:{sebastian:["积分攒了不少了。……花掉吧，攒着又不会下崽。这话我说过？那就再说一遍。"],haley:["这么多积分还不花？换个好看的，摆着也开心。"],linus:["积分攒多了，就像果子熟透了。该摘下来，尝一口了。"]},

function pickPageLine(page,status,char,seed){var set=PAGE_LINES[page];if(!set)return null;var pool=set[status][char];return pool[Math.abs(seed)%pool.length]||pool[0]||null;}

    var rq=indexedDB.open(IDB_NAME,1);
    rq.onupgradeneeded=function(){rq.result.createObjectStore("kv");};
    rq.onsuccess=function(){resolve(rq.result);};
    rq.onerror=function(){idbPromise=null;reject(rq.error);};
  });
  return idbPromise;
}

      var s=sigOf(r);if(seen[s])return;seen[s]=1;res.push(r);
    });
    out[key]=res;
  }
  dedupeBySig("anchors",function(a){return (a.text||"")+"|"+(a.time||"")+"|"+(!Array.isArray(a.days)?"daily":a.days.slice().sort(function(x,y){return x-y;}).join(","));});
  dedupeBySig("cycles",function(c){return (c.name||"")+"|"+c.type+"|"+(c.n||1)+"|"+(c.dow||0)+"|"+(c.day||1)+"|"+(c.month||1);});
  /* 今日全清奖励按天去重、完成类奖励按幂等键（idem）去重：两台设备各发一次，合并后只留最早一条，钱包按账本推导随之不双计 */
  var seenClear={},seenIdem={},seenTodoText={};var deduped=[];
  out.ledger.slice().sort(function(a,b){return recUAt(a)-recUAt(b);}).forEach(function(l){
    if(l.reason==="今日全清奖励"){if(seenClear[l.date])return;seenClear[l.date]=1;}
    if(l.idem){if(seenIdem[l.idem])return;seenIdem[l.idem]=1;}
    /* 同日同文字待办的完成奖励只留一笔（两台设备离线各勾一次同名待办，合并后不双计） */
    if(l.reason&&l.reason.indexOf("完成待办：")===0){var tk=l.date+"|"+l.reason;if(seenTodoText[tk])return;seenTodoText[tk]=1;}
    deduped.push(l);
  });
  deduped.sort(function(a,b){return recUAt(b)-recUAt(a);});
  out.ledger=deduped;
  /* 鹈鹕报道按日存档 newsDays：按日期逐条合并，同一日期取 uAt 较新的一份（定稿版不被旧设备上的未定稿版覆盖靠 uAt 比较） */
  var ndMap={},ndOrder=[];
  [L.newsDays,R.newsDays].forEach(function(arr){
    (Array.isArray(arr)?arr:[]).forEach(function(d){
      if(!d||!d.date)return;
      if(!ndMap[d.date]){ndMap[d.date]=d;ndOrder.push(d.date);}
      else if(recUAt(d)>recUAt(ndMap[d.date]))ndMap[d.date]=d;
    });
  });
  out.newsDays=ndOrder.map(function(dt){return ndMap[dt];}).sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  /* 祝尼魔捉迷藏：同 date 取 catches 较大者（rewarded 取 OR，藏身点跟 catches 大的那份走，防进度被合回去）；date 不同取较新 date 整份 */
  var lj=(L.junimo&&typeof L.junimo==="object")?L.junimo:null,rj=(R.junimo&&typeof R.junimo==="object")?R.junimo:null;
  if(lj||rj){
    var jp;
    if(lj&&rj&&lj.date&&lj.date===rj.date){
      var lc2=lj.catches||0,rc2=rj.catches||0;
      var jsrc=lc2>=rc2?lj:rj;
      jp={date:lj.date,catches:Math.max(lc2,rc2),rewarded:!!(lj.rewarded||rj.rewarded),spot:jsrc.spot||null};
      if(jp.rewarded||jp.catches>=3)jp.spot=null;
    }else{
      var jnew=(lj&&rj)?((String(lj.date||"")>String(rj.date||""))?lj:rj):(lj||rj);
      jp={date:jnew.date||"",catches:jnew.catches||0,rewarded:!!jnew.rewarded,spot:jnew.spot||null};
    }
    out.junimo=jp;
  }
  var cutoff=Date.now()-90*86400000;
  out._del=Object.keys(delMap).map(function(k){return delMap[k];}).filter(function(t){return t.ts>cutoff;});
  /* 档案取 uAt 较新者；成就取并集保留最早解锁日；已购道具取并集 */
  var lu=L._profileUAt||0,ru=R._profileUAt||0;
  if(ru>lu)out.profile=mergeDefaults(R).profile;
  out._profileUAt=Math.max(lu,ru);
  var un={};
  [L.unlocked||{},R.unlocked||{}].forEach(function(src){Object.keys(src).forEach(function(k){if(!un[k]||String(src[k])<String(un[k]))un[k]=src[k];});});
  out.unlocked=un;
  var go=(L.goldOwned||[]).slice();
  (R.goldOwned||[]).forEach(function(x){if(go.indexOf(x)<0)go.push(x);});
  out.goldOwned=go;
  /* 旅行商人限定货拥有标记：与常规货分开存 merchantOwned，合并同样取并集，不丢已购限定货 */
  var mo=(L.merchantOwned||[]).slice();
  (R.merchantOwned||[]).forEach(function(x){if(mo.indexOf(x)<0)mo.push(x);});
  out.merchantOwned=mo;
  /* 星之果实授予记录：取并集（哪台设备授过都保留，已授日期取较早的一天）；
     合并后再按基线口径逐个派生校验，不达标的直接删掉，防止旧设备把已撤销的果子合回来 */
  (function(){
    var sd={};
    [L.stardrops,R.stardrops].forEach(function(o){if(o&&typeof o==="object")Object.keys(o).forEach(function(k){if(typeof o[k]==="string"&&o[k]&&(!sd[k]||o[k]<sd[k]))sd[k]=o[k];});});
    out.stardrops=sd;
    Object.keys(out.stardrops).forEach(function(k){if(!stardropMetIn(out,k))delete out.stardrops[k];});
  })();
  /* 秘密纸条：当天条目取日期较新的一份（同日时优先已找到的那份）；收藏 found 取并集，轮换池 cycle 取并集（宁可早洗牌，不重复发同一条） */
  (function(){
    var ln=(L.notes&&typeof L.notes==="object"&&!Array.isArray(L.notes))?L.notes:null;
    var rn=(R.notes&&typeof R.notes==="object"&&!Array.isArray(R.notes))?R.notes:null;
    if(!ln&&!rn){out.notes={date:"",noteId:null,page:null,corner:null,found:[],cycle:[]};}
    else if(!ln){out.notes=rn;}
    else if(!rn){out.notes=ln;}
    else{
      function foundOn(o){return (o.found||[]).some(function(f){return f.date===o.date;});}
      var pick=ln;
      if(rn.date>ln.date)pick=rn;
      else if(rn.date===ln.date&&foundOn(rn)&&!foundOn(ln))pick=rn;
      var merged={date:pick.date,noteId:pick.noteId,page:pick.page,corner:pick.corner,found:[],cycle:[]};
      var fseen={};
      [ln.found,rn.found].forEach(function(arr){(arr||[]).forEach(function(f){if(f&&f.noteId){var k=f.date+"|"+f.noteId;if(!fseen[k]){fseen[k]=1;merged.found.push(f);}}});});
      var cseen={};
      [ln.cycle,rn.cycle].forEach(function(arr){(arr||[]).forEach(function(id){if(id&&!cseen[id]){cseen[id]=1;merged.cycle.push(id);}});});
      out.notes=merged;
    }
  })();
  /* 技能升级发奖进度：每维取已发奖到的较高等级，防止两台设备合并后重复发奖 */
  (function(){
    var sg={};
    [L.skillGrants,R.skillGrants].forEach(function(o){if(o&&typeof o==="object"&&!Array.isArray(o))Object.keys(o).forEach(function(k){var v=Number(o[k])||0;if(!sg[k]||v>sg[k])sg[k]=v;});});
    out.skillGrants=sg;
  })();
  /* 习惯菜园：按 habitId 逐个合并，harvests/cycle 取较大者（crop 由 id 哈希派生，两边必一致） */
  (function(){
    var gm={};
    [L.garden,R.garden].forEach(function(o){if(o&&typeof o==="object"&&!Array.isArray(o))Object.keys(o).forEach(function(k){
      var v=o[k]||{};var hv=Number(v.harvests)||0,cyc=Number(v.cycle)||0;
      if(!gm[k])gm[k]={crop:gardenCropFor(k).key,harvests:hv,cycle:cyc};
      else{gm[k].harvests=Math.max(gm[k].harvests,hv);gm[k].cycle=Math.max(gm[k].cycle,cyc);}
    });});
    out.garden=gm;
  })();
  /* 钱包从账本推导：期初基数 + 合并后账本增量之和 */
  out._baseGold=typeof L._baseGold==="number"?L._baseGold:(typeof R._baseGold==="number"?R._baseGold:0);
  out._basePoints=typeof L._basePoints==="number"?L._basePoints:(typeof R._basePoints==="number"?R._basePoints:0);
  var g=out._baseGold,p=out._basePoints;
  out.ledger.forEach(function(l){if(l.kind==="gold")g+=l.delta||0;else p+=l.delta||0;});
  out.wallet={gold:g,points:Math.max(0,p)};
  return{state:out,added:added};
}

/* ---- 云端同步（farm_state）：先拉 → 按记录合并 → 再推 ---- */
function cloudPull(){
  return ensureToken().then(function(ok){
    if(!ok)throw new Error(sync._refreshSt==="network"?"network":"no-token");
    return fetch(SUPABASE_URL+"/rest/v1/farm_state?select=data,updated_at&user_id=eq."+encodeURIComponent(session.user_id),{headers:authHeaders()});
  }).then(function(r){if(!r.ok)throw new Error("pull-"+r.status);return r.json();})
    .then(function(rows){return (rows&&rows.length)?rows[0]:null;});
}
function cloudPush(){
  return ensureToken().then(function(ok){
    if(!ok)throw new Error(sync._refreshSt==="network"?"network":"no-token");
    var h=authHeaders();h["Prefer"]="resolution=merge-duplicates,return=minimal";
    var body={user_id:session.user_id,data:S,updated_at:new Date(meta.updatedAt||Date.now()).toISOString()};
    return fetch(SUPABASE_URL+"/rest/v1/farm_state?on_conflict=user_id",{method:"POST",headers:h,body:JSON.stringify(body)});
  }).then(function(r){if(!r.ok)throw new Error("push-"+r.status);});
}
function scheduleSync(){
  if(!session)return;
  sync.dirty=true;
  if(!navigator.onLine){setSyncMode("offline");return;}
  setSyncMode("syncing");
  if(sync.timer)clearTimeout(sync.timer);
  sync.timer=setTimeout(syncNow,1200);
}
/* 同步一轮：先拉云端 → 按记录合并 → 再推合并结果。登录也走这条路，不再整包静默覆盖。
   推送防并发：pushing 期间的新改动靠 gen 计数识别，推完发现 gen 变了就再同步一轮，不误标已同步。 */
function syncNow(){
  if(!session){setSyncMode("nologin");return;}
  if(sync.pushing)return;
  if(!navigator.onLine){setSyncMode("offline");var cso=checkClearStreak();if(cso){persistLocal();pushBanners([cso]);}return;}
  sync.pushing=true;setSyncMode("syncing");
  cloudPull().then(function(row){
    sync.lastPullAt=Date.now();
    var added=0;
    if(row&&row.data&&typeof row.data==="object"){
      var merged=mergeStates(S,mergeDefaults(row.data));
      added=merged.added;
      S=merged.state;normalizeState();
      comp.char=isCharId(S.profile.companion)?S.profile.companion:"sebastian";
    }
    meta.updatedAt=Date.now();persistLocal();render();renderCompanion();
    if(added>0)pushBanners([{icon:"inbox",title:"已和云端合并 · 补进来 "+added+" 条记录",sub:"两台设备的记录都保留了",small:true}]);
    var css=checkClearStreak();
    if(css){persistLocal();pushBanners([css]);}
    var genAtPush=sync.gen;
    return cloudPush().then(function(){
      sync.pushing=false;
      sync.lastSyncAt=Date.now();meta.lastSyncAt=sync.lastSyncAt;saveMeta();
      if(sync.gen===genAtPush){sync.dirty=false;setSyncMode("synced");}
      else{setSyncMode("syncing");syncNow();}
    });
  }).catch(function(err){sync.pushing=false;setSyncMode(classifySyncError(err));});
}
/* 同步失败分型：断网 / 登录失效 / 服务端拒绝（权限）分别提示，不再统一写「离线」 */
function classifySyncError(err){
  var m=String((err&&err.message)||"");
  if(!navigator.onLine||m==="network")return "offline";
  if(m==="no-token"||m.indexOf("401")>=0)return "autherr";
  if(m.indexOf("403")>=0)return "denied";
  return "offline";
}
function pushNow(){syncNow();}
function initialSync(){syncNow();}
window.addEventListener("online",function(){
  if(!session){updateSyncBadge();return;}
  if(sync.dirty||sync.mode==="offline")pushNow();else updateSyncBadge();
});
window.addEventListener("offline",function(){
  if(session)setSyncMode("offline");else updateSyncBadge();
});
/* 切回前台时，距上次拉取超过 60 秒就自动补拉合并一次 */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="visible"&&session&&Date.now()-sync.lastPullAt>60000)syncNow();
});

/* 登录/注册进行中：按钮置灰并改字样，让点击一定有看得见的反馈；请求 15 秒超时，避免连接卡住时点了像没反应 */
function authBusy(on,label){

function authFetch(url,body){

  if(ctrl)opt.signal=ctrl.signal;

/* ============ 账本 / 钱包 ============ */
function addLedger(kind,delta,reason,date,idem){
  if(delta===0)return;
  /* 完成类奖励带幂等键（完成类型+事项 id+日期）：同键已在账本里就不再记第二笔，
     两台设备离线各完成一次、云端合并后也只保留一笔（合并处按 idem 去重） */
  if(idem&&S.ledger.some(function(l){return l.idem===idem;}))return;
  var now=Date.now();
  var entry={id:uid(),kind:kind,delta:delta,reason:reason,date:date,ts:now,uAt:now};
  if(idem)entry.idem=idem;
  S.ledger.unshift(entry);
  if(kind==="gold")S.wallet.gold+=delta;else S.wallet.points=Math.max(0,S.wallet.points+delta);
}
function ledgerHas(reason,date){return S.ledger.some(function(l){return l.reason===reason&&l.date===date;});}
/* 记录级更新时间戳（同步按条合并取较新者）与删除墓碑（防另一台旧副本把删掉的记录复活） */
function touch(r){if(r)r.uAt=Date.now();return r;}
function touchProfile(){S._profileUAt=Date.now();}
function tombstone(list,idKey){if(!Array.isArray(S._del))S._del=[];S._del.push({list:list,id:idKey,ts:Date.now()});}

/* ============ 成就引擎 ============ */
function computeStats(){
  var today=todayStr();
  var byDate={};
  S.todos.forEach(function(t){var e=byDate[t.date]||(byDate[t.date]={total:0,done:0});e.total++;if(t.done)e.done++;});
  var dayCleared=false;Object.keys(byDate).forEach(function(k){var e=byDate[k];if(e.total>0&&e.done===e.total)dayCleared=true;});
  var completions=S.ledger.filter(function(l){return l.kind==="gold"&&l.delta>0&&l.reason.indexOf("完成")===0;});
  /* 夜猫子：23:30 之后或凌晨 5:00 之前完成一件 */
  var nightOwl=completions.some(function(l){var d=new Date(l.ts);return (d.getHours()===23&&d.getMinutes()>=30)||d.getHours()<5;});
  /* 早睡模范：当天待办至少 2 条且全清，最后一件完成时间落在 18:00–22:00 才算（堵清晨建一条勾一条误解锁） */
  var earlyClear=false;
  Object.keys(byDate).forEach(function(date){var e=byDate[date];if(e.total>=2&&e.done===e.total){
    var dc=completions.filter(function(l){return l.date===date&&l.reason.indexOf("完成待办：")===0;});
    if(dc.length>0){var lastTs=Math.max.apply(null,dc.map(function(l){return l.ts||0;}));var lh=new Date(lastTs).getHours();if(lh>=18&&lh<22)earlyClear=true;}}});
  var doneWork=S.workItems.filter(function(w){return w.done;});
  var speedy=doneWork.some(function(w){return w.doneDate&&dateStrOfTs(w.createdTs)===w.doneDate;});
  var lastMinute=doneWork.some(function(w){return w.doneDate&&w.dueDate&&w.dueDate===w.doneDate;});
  var doneByDay={};doneWork.forEach(function(w){if(w.doneDate)doneByDay[w.doneDate]=(doneByDay[w.doneDate]||0)+1;});
  var juanwang=Object.keys(doneByDay).some(function(k){return doneByDay[k]>=3;});
  var clicksByDay={};S.sebClicks.forEach(function(c){clicksByDay[c.date]=(clicksByDay[c.date]||0)+1;});
  var stamps=[];S.todos.forEach(function(t){stamps.push(t.createdTs);});S.workItems.forEach(function(w){stamps.push(w.createdTs);});S.ledger.forEach(function(l){stamps.push(l.ts);});
  var daysUsed=stamps.length===0?0:Math.max(0,Math.round((new Date(today)-new Date(dateStrOfTs(Math.min.apply(null,stamps))))/86400000));
  return {
    published:S.todos.length+S.workItems.length,
    todosDone:S.todos.filter(function(t){return t.done;}).length,
    workDone:doneWork.length,
    pomodoros:S.pomodoros.length,

/* 今日范围（单一口径）：今日待办 + 已接取（stage=active）且 dueDate<=今日 的工作事项。
   work 是其中未完成的列表（全清判定与今日页待办列表用）；total/done 按 workAll（不论完成与否）计，办完工作事项进度也要涨。
   顶栏进度、今日进度条、全清判定与全清奖励全部共用这一个函数。
   全清不含习惯、不含锚点：习惯是长期浇灌，锚点在今日页单独显示进度，都不进全清分母。 */
function todayScope(){
  var today=todayStr();
  var todos=S.todos.filter(function(t){return t.date===today;});
  var work=S.workItems.filter(function(w){return !w.done&&w.stage==="active"&&w.dueDate&&w.dueDate<=today;});
  var workAll=S.workItems.filter(function(w){return w.stage==="active"&&w.dueDate&&w.dueDate<=today;});
  var workDone=workAll.filter(function(w){return w.done;});
  var todosDone=todos.filter(function(t){return t.done;}).length;
  return{todos:todos,work:work,workAll:workAll,workDone:workDone,todosDone:todosDone,total:todos.length+workAll.length,done:todosDone+workDone.length};
}
/* 今日全清：今日范围内的事全办完（至少一项）+20 G，每日一次 */
function checkDayClear(){
  var today=todayStr();
  if(ledgerHas("今日全清奖励",today))return checkClearStreak();
  var sc=todayScope();
  if(sc.total===0)return null;
  if(sc.todos.some(function(t){return !t.done;}))return null;
  if(sc.work.length>0)return null;
  addLedger("gold",20,"今日全清奖励",today);
  return {kind:"dayClear",title:"今天的事，都办完了。",sub:"+20 G",icon:"star",small:false};
}
/* 全清坚持奖励：连续全清满 7 天 +5 积分，断一天重数，每周封顶一次（幂等，周一起始）。
   事实来源：账本中「今日全清奖励」的日期集合（每日至多一条）；幂等键 clear-streak:<本周周一>，
   addLedger 按 idem 拦截、合并时也按 idem 去重，两台设备不会双发。 */
function checkClearStreak(){
  var today=todayStr();
  var clearDays={};
  S.ledger.forEach(function(l){if(l.reason==="今日全清奖励")clearDays[l.date]=true;});
  if(!clearDays[today])return null;
  var streak=0,d=today;
  while(clearDays[d]){streak++;d=shiftDate(d,-1);}
  if(streak<7)return null;
  var idem="clear-streak:"+weekStartOf(today);
  if(S.ledger.some(function(l){return l.idem===idem;}))return null;
  addLedger("points",5,"全清坚持奖励",today,idem);
  return {kind:"clearStreak",title:"连续全清满 7 天",sub:"+5 积分",icon:"star",small:true};
}

function pageStatus(page){
  var today=todayStr();
  var open=S.workItems.filter(function(w){return !w.done;});
  var redWork=open.filter(function(w){return urgencyLevel(today,w.dueDate)==="red";});
  switch(page){
    case "life":{
      if(redWork.length>0)return "urgent";
      var my=S.todos.filter(function(t){return t.date===today;});
      var due=open.filter(function(w){return w.dueDate&&w.dueDate<=today;});
      return my.length===0&&due.length===0?"empty":"normal";}
    case "plan":
      if(S.todos.some(function(t){return t.date<today&&!t.done;}))return "urgent";
      return S.todos.some(function(t){return t.date===today;})?"normal":"empty";
    case "review":
      if(S.reviews.length===0)return "empty";
      if(!S.reviews.some(function(r){return r.date===today;})&&new Date().getHours()>=21)return "urgent";
      return "normal";
    case "mood":{
      var tm=null;S.moods.forEach(function(m){if(m.date===today)tm=m;});
      if(!tm)return "empty";return LOW_MOODS[tm.mood]?"urgent":"normal";}
    case "memo":
      if(S.memos.length===0)return "empty";return S.memos.length>=10?"urgent":"normal";
    case "study":
      if(S.studyTopics.length===0)return "empty";
      return S.studyLogs.some(function(l){return l.date>=shiftDate(today,-7);})?"normal":"urgent";
    case "fitness":
      if(S.workouts.length===0)return "empty";
      return S.workouts.some(function(w){return w.date>=shiftDate(today,-7);})?"normal":"urgent";
    case "finance":{
      if(S.financeTx.length===0)return "empty";
      var mo=today.slice(0,7);var inc=0,exp=0;
      S.financeTx.forEach(function(t){if(t.date.indexOf(mo)===0){if(t.kind==="income")inc+=t.amountCents;else exp+=t.amountCents;}});
      return exp>inc&&exp>0?"urgent":"normal";}
    case "habits":
      if(S.habits.length===0)return "empty";
      return S.habits.some(function(h){return habitView(h).checkedToday;})?"normal":"urgent";
    case "workToday":
      if(open.length===0)return "empty";
      return open.some(function(w){return w.dueDate&&w.dueDate<=today;})?"urgent":"normal";
    case "office":case "medical":case "cert":{
      var mine=open.filter(function(w){return w.kind===page;});
      if(mine.length===0)return "empty";
      return mine.some(function(w){return urgencyLevel(today,w.dueDate)==="red";})?"urgent":"normal";}
    case "regions":case "regionDetail":{

      var outing=open.filter(function(w){return w.outing&&(page==="regions"||w.district===ui.regionDistrict);});
      if(outing.length===0)return "empty";

    case "calendar":{

      if(ui.calSpace==="work"){
        if(open.length===0)return "empty";
        return open.some(function(w){return w.dueDate&&w.dueDate<=today;})?"urgent":"normal";}
      if(redWork.length>0)return "urgent";

      var dueCal=open.filter(function(w){return w.dueDate&&w.dueDate<=today;});

/* ============ 习惯菜园（习惯页顶部）：一习惯一株，作物按 habit id 哈希固定分配 ============
   数据：S.garden[habitId]={crop,harvests,cycle}；crop 由 id 哈希派生（存下只是缓存，派生为准）。
   本轮计数 = 该习惯 habitLogs 总条数 - 10*cycle（派生，不另存计数）。
   阶段：0 种子 / >=2 新芽 / >=4 小苗 / >=7 开花 / >=10 成熟（可收获 +15G，幂等键 garden:<id>:<cycle>）。
   后续随机事件「作物仙女」往 gardenProgress(habitId) 的返回结构里加成即可。 */
var GARDEN_CROPS=[
  {key:"pumpkin",label:"南瓜",main:"#e67e22",dark:"#c05f10",flower:"#ffd83d"},
  {key:"strawberry",label:"草莓",main:"#e13b3b",dark:"#b02828",flower:"#fff6da"},
  {key:"corn",label:"玉米",main:"#ffd83d",dark:"#d9a41f",flower:"#f5c56b"},
  {key:"sunflower",label:"向日葵",main:"#f0a832",dark:"#6b3f1d",flower:"#ffd83d"},
  {key:"carrot",label:"胡萝卜",main:"#f07818",dark:"#c85a08",flower:"#fff6da"},
  {key:"blueberry",label:"蓝莓",main:"#3a6ea8",dark:"#2c4a73",flower:"#f6c6d8"},
  {key:"eggplant",label:"茄子",main:"#7a4a9e",dark:"#5a3378",flower:"#c9a8e8"},
  {key:"grape",label:"葡萄",main:"#8848c8",dark:"#65309e",flower:"#e8dcc0"}
];
var GARDEN_STAGE_LABELS=["种子","新芽","小苗","开花","成熟"];
function gardenCropFor(habitId){
  var str=String(habitId),h=0;
  for(var i=0;i<str.length;i++){h=((h*31)+str.charCodeAt(i))>>>0;}
  return GARDEN_CROPS[h%GARDEN_CROPS.length];
}
function gardenEntry(habitId){
  if(!S.garden||typeof S.garden!=="object"||Array.isArray(S.garden))S.garden={};
  var g=S.garden[habitId];
  if(!g||typeof g!=="object"){g={crop:gardenCropFor(habitId).key,harvests:0,cycle:0};S.garden[habitId]=g;}
  if(typeof g.harvests!=="number"||g.harvests<0)g.harvests=0;
  if(typeof g.cycle!=="number"||g.cycle<0)g.cycle=0;
  g.crop=gardenCropFor(habitId).key;
  return g;
}
function gardenStageOf(count){
  if(count>=10)return 4; if(count>=7)return 3; if(count>=4)return 2; if(count>=2)return 1; return 0;
}
/* 蔫态判定（只影响视觉，不掉进度）：
   日型：已有打卡记录，且昨天没打卡、今天也还没打卡（即已错过昨天的应打卡日；无记录的新习惯不蔫）。
   周型：上一周（周一至周日）打卡数 < weeklyTarget，且本周至今 0 次打卡。 */
function gardenWilted(h){
  var today=todayStr();
  var logs=S.habitLogs.filter(function(l){return l.habitId===h.id;});
  if(logs.some(function(l){return l.date===today;}))return false;
  if(h.kind==="weekly"){
    var ws=weekStartOf(today);
    var pws=shiftDate(ws,-7),pwe=shiftDate(ws,-1);
    var prev=logs.filter(function(l){return l.date>=pws&&l.date<=pwe;}).length;
    var cur=logs.filter(function(l){return l.date>=ws&&l.date<=today;}).length;
    return prev<(h.weeklyTarget||3)&&cur===0;
  }
  if(logs.length===0)return false;
  var yest=shiftDate(today,-1);
  return !logs.some(function(l){return l.date===yest;});
}
/* 本轮进度单一入口：返回 {count,stage,stageLabel,crop,cropLabel,total,cycle,harvests,wilted,mature} */
function gardenProgress(habitId){
  var h=findById(S.habits,habitId);
  var g=gardenEntry(habitId);
  var total=S.habitLogs.filter(function(l){return l.habitId===habitId;}).length;
  var count=Math.max(0,total-10*g.cycle);
  var stage=gardenStageOf(count);
  return {count:count,stage:stage,stageLabel:GARDEN_STAGE_LABELS[stage],
    crop:g.crop,cropLabel:(GARDEN_CROPS.filter(function(c){return c.key===g.crop;})[0]||GARDEN_CROPS[0]).label,
    total:total,cycle:g.cycle,harvests:g.harvests,
    wilted:h?gardenWilted(h):false,mature:count>=10};
}
/* 作物像素图：5 阶段递进（种子->新芽->小苗->开花->成熟结果）+ 蔫态（换枯色、整体耷拉右倾下沉） */
function gardenCropSvg(cropKey,stage,wilted,size){
  var crop=GARDEN_CROPS[0];
  GARDEN_CROPS.forEach(function(c){if(c.key===cropKey)crop=c;});
  var stem=wilted?"#7a6a42":"#3d7a24",leaf=wilted?"#8a7a4a":"#5da33c",leaf2=wilted?"#6f6240":"#4c9433";
  var fruit=wilted?"#a08b6d":crop.main,fruitD=wilted?"#8a7557":crop.dark,flower=wilted?"#b0a090":crop.flower;
  var dx=wilted?1:0,dy=wilted?1:0;
  var r=[[1,14,14,2,"#6b3f1d"],[1,14,14,1,"#8a5a2b"],[4,15,2,1,"#5a3418"],[10,15,2,1,"#5a3418"]];
  if(stage<=0){
    r.push([7+dx,12+dy,3,2,wilted?"#9a8a6d":"#d8b98a"],[8+dx,12+dy,1,1,"#fff6da"]);
    return rectsSvg(r,"0 0 16 16",size||44);
  }
  if(stage===1){
    r.push([7+dx,11+dy,2,3,stem],[4+dx,10+dy,4,2,leaf],[8+dx,9+dy,4,2,leaf2]);
    return rectsSvg(r,"0 0 16 16",size||44);
  }
  if(stage===2){
    r.push([7+dx,8+dy,2,6,stem],[3+dx,9+dy,5,2,leaf],[8+dx,7+dy,5,2,leaf2],[5+dx,6+dy,3,2,leaf]);
    return rectsSvg(r,"0 0 16 16",size||44);
  }
  if(stage===3){
    r.push([7+dx,6+dy,2,8,stem],[3+dx,8+dy,5,2,leaf],[8+dx,6+dy,5,2,leaf2],[4+dx,4+dy,3,2,leaf]);
    r.push([6+dx,1+dy,4,3,flower],[7+dx,2+dy,2,1,fruitD]);
    r.push([11+dx,4+dy,3,3,flower],[12+dx,5+dy,1,1,fruitD]);
    return rectsSvg(r,"0 0 16 16",size||44);
  }
  /* 成熟：按作物形态结果 */
  r.push([7+dx,6+dy,2,8,stem],[3+dx,8+dy,5,2,leaf],[8+dx,6+dy,5,2,leaf2],[4+dx,4+dy,3,2,leaf]);
  if(crop.key==="pumpkin"){
    r.push([4,10,8,4,fruit],[6,10,1,4,fruitD],[9,10,1,4,fruitD],[7,9,2,1,stem]);
  }else if(crop.key==="carrot"){
    r.push([6+dx,2+dy,1,3,leaf],[8+dx,1+dy,1,4,leaf2],[10+dx,2+dy,1,3,leaf]);
    r.push([6,11,4,2,fruit],[7,13,2,1,fruitD]);
  }else if(crop.key==="sunflower"){
    r.push([5+dx,0+dy,6,1,flower],[4+dx,1+dy,8,3,flower],[6+dx,1+dy,4,2,fruitD],[7+dx,2+dy,2,1,"#4a2c14"]);
  }else if(crop.key==="corn"){
    r.push([8+dx,4+dy,3,7,fruit],[9+dx,5+dy,1,5,fruitD],[5+dx,7+dy,3,4,leaf2]);
  }else if(crop.key==="grape"){
    r.push([5+dx,3+dy,6,2,leaf]);
    r.push([5+dx,5+dy,2,2,fruit],[8+dx,5+dy,2,2,fruit],[6+dx,7+dy,2,2,fruitD],[9+dx,7+dy,2,2,fruit],[7+dx,9+dy,2,2,fruitD]);
  }else if(crop.key==="eggplant"){
    r.push([5+dx,4+dy,3,2,leaf2]);
    r.push([5+dx,6+dy,4,6,fruit],[6+dx,6+dy,2,1,fruitD],[10+dx,8+dy,3,4,fruit]);
  }else if(crop.key==="strawberry"){
    r.push([4,9,4,4,fruit],[9,10,3,3,fruit],[5,9,2,1,leaf],[6,10,1,1,"#fff6da"],[10,11,1,1,"#fff6da"]);
  }else{ /* blueberry */

  }
  return rectsSvg(r,"0 0 16 16",size||44);

/* 收获：成熟才可点；幂等键 garden:<habitId>:<cycle>，同键已发过金则整笔不再执行（harvests/cycle 只 +1） */

var bannerQueue=[],bannerSeq=0,dayClearSeq=0,bannerTimer=null;
function pushBanners(items){
  items.forEach(function(it){
    if(it.kind==="dayClear"){
      var sub=DAY_CLEAR_SUBS[dayClearSeq%DAY_CLEAR_SUBS.length];dayClearSeq++;
      it={icon:it.icon,title:it.title,sub:sub+"（+20 G）",small:it.small};
    }
    bannerQueue.push({id:++bannerSeq,icon:it.icon,title:it.title,sub:it.sub||"",small:!!it.small});
  });
  renderBanner();
}
function renderBanner(){
  var root=document.getElementById("banner-root");
  var b=bannerQueue[0];
  /* 标题屏/登录层还没关时先排队，不被遮挡；关屏后由 renderSplash 的收尾再调一次本函数弹出 */
  if(b&&document.body.classList.contains("locked")){root.innerHTML="";return;}
  if(bannerTimer){clearTimeout(bannerTimer);bannerTimer=null;}
  if(!b){root.innerHTML="";return;}
  root.innerHTML='<div class="banner-slot"><button type="button" class="wood-panel banner-card bannerdown" data-act="banner-close" aria-label="关闭提示：'+esc(b.title)+'">'
    +'<span class="banner-badge" style="width:'+(b.small?46:60)+'px">'+pixIcon(b.icon,b.small?26:38)+'</span>'
    +'<span style="flex:1;padding:'+(b.small?"8px 12px":"10px 12px")+'"><span class="font-pixel" style="display:block;font-size:'+(b.small?14:16)+'px">'+esc(b.title)+'</span>'
    +(b.sub?'<span class="small" style="display:block;margin-top:2px;color:#7a4a16">'+esc(b.sub)+'</span>':"")
    +'</span></button></div>';
  bannerTimer=setTimeout(function(){bannerQueue.shift();renderBanner();},4000);
}

function mutate(fn,opts){
  opts=opts||{};
  var banners=fn()||[];

  save();

  if(banners.length){

}

/* 链接来源小标：按域名映射常见站点，其余显示域名本身；无合法链接返回 "" */
function linkHostLabel(url){
  if(!url||!/^https?:\/\//i.test(url))return "";
  var host="";
  try{host=new URL(url).hostname.toLowerCase();}catch(e){var m=String(url).match(/^https?:\/\/([^\/:?#]+)/i);host=m?m[1].toLowerCase():"";}
  if(!host)return "";
  function has(d){return host===d||host.slice(-(d.length+1))==="."+d;}
  if(has("bilibili.com"))return "B站";
  if(has("youtube.com")||has("youtu.be"))return "YouTube";
  if(has("pan.baidu.com"))return "百度网盘";
  if(has("aliyundrive.com")||has("alipan.com"))return "阿里云盘";
  if(has("pan.quark.cn"))return "夸克网盘";
  if(has("github.com"))return "GitHub";
  return host;
}

}
function deleteFinanceTx(id){tombstone("financeTx","i:"+id);S.financeTx=S.financeTx.filter(function(t){return t.id!==id;});}
function importFinanceRows(rows){
  var errors=[],valid=[],skipped=0,skippedRows=[],suspects=[];
  /* 两档去重：①全字段（日期+标题+金额+类型+分类）都与已有流水或本次已导入行完全一致 → 判为重复导入，跳过并记行号；
     ②仅 日期+标题+金额+类型 相同（分类不同）→ 疑似重复：照常导入，行号单列出来，事后由用户核对决定 */
  var fullSeen={},susSeen={};
  function fullKey(date,title,cents,kind,cat){return date+"|"+title+"|"+cents+"|"+kind+"|"+cat;}
  function susKey(date,title,cents,kind){return date+"|"+title+"|"+cents+"|"+kind;}
  S.financeTx.forEach(function(t){
    fullSeen[fullKey(t.date,t.title,t.amountCents,t.kind,t.category||"")]=1;
    susSeen[susKey(t.date,t.title,t.amountCents,t.kind)]=1;
  });
  rows.forEach(function(r,i){
    var rowNo=(typeof r.rowNo==="number")?r.rowNo:i+2;
    if(!/^\d{4}-\d{2}-\d{2}$/.test(r.date)){errors.push({row:rowNo,message:"日期格式不对（应为 YYYY-MM-DD）：「"+r.date+"」"});return;}
    if(!String(r.title).trim()){errors.push({row:rowNo,message:"标题为空"});return;}
    if(!isFinite(r.amount)||r.amount===0){errors.push({row:rowNo,message:"金额不是有效数字：「"+r.amount+"」"});return;}
    var kind=(r.kind==="income"||r.kind==="收入")?"income":"expense";
    var rec={id:uid()+i,date:r.date,title:String(r.title).trim(),category:String(r.category||"").trim()||"其他",amountCents:Math.round(Math.abs(r.amount)*100),kind:kind,uAt:Date.now()};
    var fk=fullKey(rec.date,rec.title,rec.amountCents,rec.kind,rec.category);
    if(fullSeen[fk]){skipped++;skippedRows.push(rowNo);return;}
    if(susSeen[susKey(rec.date,rec.title,rec.amountCents,rec.kind)])suspects.push(rowNo);
    fullSeen[fk]=1;susSeen[susKey(rec.date,rec.title,rec.amountCents,rec.kind)]=1;
    valid.push(rec);
  });
  valid.reverse().forEach(function(v){S.financeTx.unshift(v);});
  return{inserted:valid.length,skipped:skipped,skippedRows:skippedRows,suspects:suspects,errors:errors};
}

function toggleHabitToday(id){
  var habit=findById(S.habits,id);if(!habit||habit.archived)return[];
  var today=todayStr();var banners=[];
  var existing=S.habitLogs.filter(function(l){return l.habitId===id&&l.date===today;});
  if(existing.length>0){
    var first=existing[0];
    tombstone("habitLogs","i:"+first.id);
    S.habitLogs=S.habitLogs.filter(function(l){return l.id!==first.id;});
  }else if(!habit.graduated){
    S.habitLogs.unshift({id:uid(),habitId:id,date:today,uAt:Date.now()});
    var goal=habit.kind==="daily"?7:habit.weeklyTarget;
    if(habit.kind==="daily"){
      if(!ledgerHas("习惯浇水："+habit.name,today))addLedger("gold",5,"习惯浇水："+habit.name,today);
    }else{
      /* 周习惯打卡 +2 G 当天只发一次：同日取消再打卡不重复发 */
      if(!ledgerHas("习惯打卡："+habit.name,today))addLedger("gold",2,"习惯打卡："+habit.name,today);
    }
    var ws=weekStartOf(today),we=shiftDate(ws,6);
    var weekLogs=S.habitLogs.filter(function(l){return l.habitId===id&&l.date>=ws&&l.date<=we;});
    if(habit.kind==="weekly"&&weekLogs.length>=goal){
      var paid=S.ledger.some(function(l){return l.reason==="习惯达标："+habit.name&&l.date>=ws&&l.date<=we;});
      if(!paid){
        addLedger("gold",15,"习惯达标："+habit.name,today);
        addLedger("points",10,"习惯达标："+habit.name,today);
        banners.push({kind:"habitGoal",title:"习惯达标："+habit.name,sub:"本周 "+weekLogs.length+"/"+goal+" · +15 G · +10 积分",icon:"starfruit",small:true});
      }
    }
    if(!habit.graduated){
      var allMet=true;
      for(var k=0;k<4;k++){
        var wStart=shiftDate(ws,-7*k),wEnd=shiftDate(wStart,6);
        var logs=S.habitLogs.filter(function(l){return l.habitId===id&&l.date>=wStart&&l.date<=wEnd;});
        if(logs.length<goal){allMet=false;break;}
      }
      if(allMet){
        habit.graduated=true;habit.graduatedDate=today;touch(habit);
        addLedger("gold",50,"习惯毕业："+habit.name,today);
        addLedger("points",30,"习惯毕业："+habit.name,today);
        banners.push({kind:"habitGraduate",title:"已养成："+habit.name,sub:"连续四周达标 · +50 G · +30 积分",icon:"star",small:false});
      }
    }
    var dc=checkDayClear();if(dc)banners.push(dc);
  }
  return banners;
}

/* ============ 周期事务（到期提醒 + 完成后按周期顺延，完成一次 +5 G） ============ */
var CYCLE_CATEGORIES=["全屋清洁","耗材更换","个人管理","其他"];
function cycleLabel(c){
  if(c.type==="days")return "每 "+(c.n||1)+" 天";
  if(c.type==="weekday")return "每周"+WEEKDAYS[c.dow||0];
  if(c.type==="weeks")return "每 "+(c.n||1)+" 周 · 周"+WEEKDAYS[c.dow||0];
  if(c.type==="monthday")return "每月 "+(c.day||1)+" 日";
  if(c.type==="months")return "每 "+(c.n||1)+" 个月";
  if(c.type==="yearly")return "每年 "+(c.month||1)+" 月 "+(c.day||1)+" 日";
  return "";
}
function advanceCycle(c,from){
  var p=from.split("-").map(Number);
  if(c.type==="days")return shiftDate(from,Math.max(1,c.n||1));
  if(c.type==="weekday")return shiftDate(from,7);
  if(c.type==="weeks")return shiftDate(from,7*Math.max(1,c.n||1));
  if(c.type==="monthday"){
    var nm=p[1]%12,ny=p[0]+(p[1]===12?1:0);
    return ymdOf(new Date(ny,nm,Math.min(c.day||p[2],daysInMonth(ny,nm))));
  }
  if(c.type==="months"){
    var total=(p[1]-1)+Math.max(1,c.n||1);var ty=p[0]+Math.floor(total/12),tm=total%12;
    return ymdOf(new Date(ty,tm,Math.min(c.day||p[2],daysInMonth(ty,tm))));
  }
  if(c.type==="yearly"){
    var yy=p[0]+1,mm=(c.month||p[1])-1;
    return ymdOf(new Date(yy,mm,Math.min(c.day||p[2],daysInMonth(yy,mm))));
  }
  return shiftDate(from,7);
}
function cycleStatus(c){
  var today=todayStr();var d=daysUntil(today,c.nextDue);
  if(d==null)return{key:"normal",label:"未排期"};
  if(d<0)return{key:"red",label:"已逾期 "+(-d)+" 天"};
  if(d===0)return{key:"orange",label:"今天到期"};
  if(d<=(c.remindDays||0))return{key:"yellow",label:d+" 天后到期"};
  return{key:"normal",label:d+" 天后到期"};
}
function addCycle(vals){

function saveCycle(id,vals){

  c.name=vals.name;c.category=vals.category;c.type=vals.type;c.n=vals.n;c.dow=vals.dow;c.day=vals.day;c.month=vals.month;
  if(vals.nextDue!==c.nextDue)c.doneNextDue=null;/* 到期日被改动：本期完成锁定随之解除 */
  c.nextDue=vals.nextDue;c.remindDays=vals.remindDays;c.supply=vals.supply||"";touch(c);
}
/* 本期是否已完成：完成时记下推进后的 nextDue（doneNextDue），它仍等于当前 nextDue 且 lastDone 在，
   说明当前这一期已经做过一次——「完成」锁定，防同周期反复点重复记历史 */
function cycleDoneThisPeriod(c){
  return !!(c&&c.doneNextDue&&c.nextDue&&c.doneNextDue===c.nextDue&&c.lastDone);
}
function completeCycle(id){
  var c=findById(S.cycles,id);if(!c)return[];
  var today=todayStr();var banners=[];
  if(cycleDoneThisPeriod(c))return banners;
  var due=c.nextDue||today;
  c.lastDone=today;
  c.history.unshift(today);if(c.history.length>60)c.history.length=60;
  /* 双顺延：固定星期型（weekday/weeks/monthday/yearly）从本期到期日推进，锚定原星期/原日期，迟做不漂移；
     间隔型（每 N 天 / 每 N 个月）从实际完成日往后推算下一次 */
  var base=(c.type==="days"||c.type==="months")?today:due;
  var next=advanceCycle(c,base);var guard=0;
  while(next<=today&&guard++<600)next=advanceCycle(c,next);
  c.nextDue=next;
  c.doneNextDue=next;
  c.supplyAddedFor=null;/* 本期物资标记重置，下一周期临近时可再自动进采购清单 */
  /* 同一期到期只发一次 +5 G：以本期到期日去重，防连点刷币 */
  if(c.lastRewardDue!==due){
    c.lastRewardDue=due;
    addLedger("gold",5,"周期事务完成："+c.name,today,"cycle:"+c.id+":"+due);
    banners.push({kind:"cycleDone",title:"周期事务完成："+c.name,sub:"+5 G · 下次到期 "+next,icon:"checkBadge",small:true});
  }
  touch(c);
  var dc=checkDayClear();if(dc)banners.push(dc);
  return banners;
}

function postponeCycle(id,days){

  if(wasAdded)c.supplyAddedFor=c.nextDue;/* 已自动进清单的，标记跟随新到期日，避免重复添加 */
  touch(c);
}
function skipCycleOccurrence(id){
  var c=findById(S.cycles,id);if(!c)return;
  var today=todayStr();
  var next=advanceCycle(c,c.nextDue||today);var guard=0;

/* 周期事务临近到期且填了「需要物资」时，自动往采购清单加一条；同一周期（同一到期日）只加一次 */

/* ============ 朋友生日：农历换算 + 下一次生日（纯函数，换算结果带内存缓存） ============ */
var LUNAR_MONTH_NAMES={"正月":1,"二月":2,"三月":3,"四月":4,"五月":5,"六月":6,"七月":7,"八月":8,"九月":9,"十月":10,"冬月":11,"腊月":12,"十一月":11,"十二月":12};
var CN_DAY_NUM={"一":1,"二":2,"三":3,"四":4,"五":5,"六":6,"七":7,"八":8,"九":9};
var lunarFmtObj=null,lunarSolarCache={};
function lunarPartsOf(date){
  if(!lunarFmtObj){try{lunarFmtObj=new Intl.DateTimeFormat("zh-Hans-u-ca-chinese",{year:"numeric",month:"long",day:"numeric"});}catch(e){return null;}}
  var o={};
  lunarFmtObj.formatToParts(date).forEach(function(p){o[p.type]=p.value;});
  return o;
}
function lunarYearOfParts(o){if(!o)return null;var y=Number(String(o.relatedYear||o.year||"").replace(/[^0-9]/g,""));return y||null;}
function lunarDayNumOf(s){
  s=String(s||"");
  if(/^[0-9]+$/.test(s))return Number(s);
  if(s==="三十")return 30;
  if(s==="二十")return 20;
  if(s.charAt(0)==="初")return CN_DAY_NUM[s.charAt(1)]||null;
  if(s.charAt(0)==="十")return 10+(CN_DAY_NUM[s.charAt(1)]||0);
  if(s.charAt(0)==="廿"||s.charAt(0)==="念")return 20+(CN_DAY_NUM[s.charAt(1)]||0);
  return null;
}
/* 农历信息表（标准编码，与官方万年历交叉验证）：低 4 位=闰月月份（0 无闰月）；
   bit 0x10000 表示闰月大（30 天，小为 29 天）；bit (0x10000>>m) 表示第 m 月大（30 天，小为 29 天） */
var LUNAR_INFO_TABLE={2025:0x0a6e6,2026:0x0a4e0,2027:0x0d260,2028:0x0ea65,2029:0x0d530};
function lunarLeapMonthOf(info){return info&0xf;}
function lunarLeapDaysOf(info){if(!lunarLeapMonthOf(info))return 0;return (info&0x10000)?30:29;}
function lunarMonthDaysOf(info,m){return (info&(0x10000>>m))?30:29;}
function lunarYearDaysOf(info){var d=348+lunarLeapDaysOf(info);for(var m=1;m<=12;m++)if(info&(0x10000>>m))d++;return d;}
/* 农历 (lunarYear, lm, ld) → 公历 "YYYY-MM-DD"：优先用内嵌信息表从锚点（农历 2025 年正月初一 = 公历 2025-01-29）
   按整年/整月天数累加；目标日超过该月天数返回 null；年份不在表中时回退到 Intl 逐日扫描。 */
function lunarToSolar(lunarYear,lm,ld){
  var ck=lunarYear+"-"+lm+"-"+ld;
  if(ck in lunarSolarCache)return lunarSolarCache[ck];
  var res=null;
  if(LUNAR_INFO_TABLE[lunarYear]!==undefined&&lunarYear>=2025){
    var info=LUNAR_INFO_TABLE[lunarYear];
    if(ld>=1&&ld<=lunarMonthDaysOf(info,lm)){
      var off=0;
      for(var y=2025;y<lunarYear;y++)off+=lunarYearDaysOf(LUNAR_INFO_TABLE[y]);
      var leapM=lunarLeapMonthOf(info);
      for(var m2=1;m2<lm;m2++){off+=lunarMonthDaysOf(info,m2);if(leapM===m2)off+=lunarLeapDaysOf(info);}
      off+=ld-1;
      var dt=new Date(2025,0,29);dt.setDate(dt.getDate()+off);
      res=ymdOf(dt);
    }
  }else{
    res=lunarToSolarIntl(lunarYear,lm,ld);
  }
  lunarSolarCache[ck]=res;
  return res;
}
/* 回退实现：从公历该年 1 月 15 日逐日扫描到次年 2 月 20 日，用 Intl 中文历逐日比对；
   带「闰」字的月份不匹配任何目标（只认非闰月）。找不到返回 null。 */
function lunarToSolarIntl(lunarYear,lm,ld){
  var res=null;
  var end=new Date(lunarYear+1,1,20);
  for(var d=new Date(lunarYear,0,15);d<=end;d.setDate(d.getDate()+1)){
    var o=lunarPartsOf(d);if(!o)break;
    var mraw=String(o.month||"");
    if(mraw.indexOf("闰")>=0)continue;
    if(lunarYearOfParts(o)===lunarYear&&LUNAR_MONTH_NAMES[mraw]===lm&&lunarDayNumOf(o.day)===ld){res=ymdOf(d);break;}
  }
  return res;
}
function nextBirthdayOf(friend,fromStr){
  var m=Number(friend.birthMonth)||1,d=Number(friend.birthDay)||1;
  var fromYear=Number(fromStr.slice(0,4));
  var cands=[];
  if(friend.calType==="lunar"){
    var fp=fromStr.split("-").map(Number);
    var o=lunarPartsOf(new Date(fp[0],fp[1]-1,fp[2]));
    var ly=lunarYearOfParts(o)||fromYear;
    [ly-1,ly,ly+1,ly+2].forEach(function(yy){
      var s=lunarToSolar(yy,m,d);
      if(s)cands.push({date:s,year:yy});
    });
  }else{
    [fromYear,fromYear+1].forEach(function(yy){
      var dd=(m===2&&d===29&&daysInMonth(yy,1)===28)?28:d;
      cands.push({date:yy+"-"+pad2(m)+"-"+pad2(dd),year:yy});
    });
  }
  cands.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  var pick=null;
  for(var i=0;i<cands.length;i++){if(cands[i].date>=fromStr){pick=cands[i];break;}}
  if(!pick)pick=cands.length?cands[cands.length-1]:null;
  if(!pick)return{date:null,daysLeft:null,age:null};
  return{date:pick.date,daysLeft:daysUntil(fromStr,pick.date),age:friend.birthYear?(pick.year-Number(friend.birthYear)):null};
}

/* ============ 旅行商人（奖励商店摊位） ============
   出摊日：每周五、周日。「同周」以周一为界（weekStartOf 取本周周一），
   周五与紧随的周日同属一周、抽同一组货；跨周（下个周一之后）换组。
   周种子：对池内每件货算 newsHash("merchant|"+本周周一+"|"+货品 key)，按哈希升序取前 3 件——
   无随机数、同周多次打开与不同设备结果一致，与鹈鹕报道 newsHash 的按日期种子风格一致。 */
function merchantIsOpen(date){var d=dowOf(date||todayStr());return d===5||d===0;}
function merchantStock(date){
  var ws=weekStartOf(date||todayStr());
  if(MERCHANT_POOL.length<=3)return MERCHANT_POOL.slice();
  return MERCHANT_POOL.slice().sort(function(a,b){
    var ha=newsHash("merchant|"+ws+"|"+a.key),hb=newsHash("merchant|"+ws+"|"+b.key);
    return ha<hb?-1:(ha>hb?1:(a.key<b.key?-1:1));
  }).slice(0,3);
}
function merchantOwnedHas(key){return (S.merchantOwned||[]).indexOf(key)>=0;}
function shopOwnedAny(key){return S.goldOwned.indexOf(key)>=0||merchantOwnedHas(key);}
function merchantDefOf(key){var d=null;MERCHANT_POOL.forEach(function(i){if(i.key===key)d=i;});return d;}
function buyMerchantItem(key,date){
  date=date||todayStr();
  var def=merchantDefOf(key);
  if(!def)return{ok:false,error:"这件商品不存在"};
  if(!merchantIsOpen(date))return{ok:false,error:"旅行商人今天不摆摊（周五、周日来）"};
  if(!merchantStock(date).some(function(i){return i.key===key;}))return{ok:false,error:"「"+def.name+"」这周没摆出来"};

/* ============ 鹈鹕报道（本地按日汇总 + 按日存档） ============ */
function eveningNews(date){
  var dayTodos=S.todos.filter(function(t){return t.date===date;});
  var workDone=S.workItems.filter(function(w){return w.done&&w.doneDate===date;});
  var led=S.ledger.filter(function(l){return l.date===date;});
  var goldDelta=led.filter(function(l){return l.kind==="gold";}).reduce(function(a,l){return a+l.delta;},0);
  var pointsDelta=led.filter(function(l){return l.kind==="points";}).reduce(function(a,l){return a+l.delta;},0);
  var achNames=Object.keys(S.unlocked).filter(function(k){return S.unlocked[k]===date;}).map(function(k){
    var d=null;ACHIEVEMENTS.forEach(function(a){if(a.key===k)d=a;});return d?d.name:k;});
  var reds=S.redemptions.filter(function(r){return r.date===date;});
  var pomos=S.pomodoros.filter(function(p){return p.date===date;}).length;
  var habitChecks=S.habitLogs.filter(function(l){return l.date===date;}).length;
  var wos=S.workouts.filter(function(w){return w.date===date;});
  var tx=S.financeTx.filter(function(t){return t.date===date;});
  var expenseYuan=tx.filter(function(t){return t.kind==="expense";}).reduce(function(a,t){return a+t.amountCents;},0)/100;
  var incomeYuan=tx.filter(function(t){return t.kind==="income";}).reduce(function(a,t){return a+t.amountCents;},0)/100;
  var tomorrow=shiftDate(date,1);
  var tomorrowWork=S.workItems.filter(function(w){return !w.done&&w.dueDate===tomorrow;}).map(function(w){return w.title;});
  var tomorrowTodos=S.todos.filter(function(t){return t.date===tomorrow&&!t.done;}).length;
  var moodRow=null;S.moods.forEach(function(m){if(m.date===date)moodRow=m;});
  var moodName=moodRow?(MOOD_LABELS[moodRow.mood]||null):null;
  var studyCount=S.studyLogs.filter(function(l){return l.date===date;}).length;
  var reviewRow=null;S.reviews.forEach(function(r){if(r.date===date)reviewRow=r;});
  var reviewDone=!!(reviewRow&&(reviewRow.gratitude||reviewRow.success||reviewRow.reflection));
  var financeCount=tx.length;
  var hasActivity=dayTodos.some(function(t){return t.done;})||workDone.length>0||led.length>0||reds.length>0||pomos>0||habitChecks>0||wos.length>0||tx.length>0||achNames.length>0||studyCount>0||reviewDone||financeCount>0||!!moodRow;
  var doneCount=dayTodos.filter(function(t){return t.done;}).length+workDone.length;
  var headline;
  if(!hasActivity)headline="小镇无事发生，鹈鹕也放假";
  else if(doneCount>=5)headline="丰收日！今日共办成 "+doneCount+" 件事";
  else if(workDone.length>0)headline="委托告捷："+(workDone[0]?workDone[0].title:"")+" 已交差";
  else if(doneCount>0)headline="稳步推进，今日办成 "+doneCount+" 件事";
  else headline="账本有动静，小镇在慢慢运转";
  var sebPool=!hasActivity
    ?["……今天什么都没发生。很好，我喜欢没有新闻的日子。","休刊？我也在休刊。别吵。"]
    :doneCount>=5
      ?["办了 "+doneCount+" 件事？……行吧，勉强算你没白活这一天。","效率不错。奖励自己一杯热可可吧，我请——用你的积分。"]
      :workDone.length>0
        ?["委托办完了？镇长应该给你发个奖状。没有？那我口头表扬一下。","跑腿回来了。鞋底还好吗。"]
        :["慢慢来。雨天就该待在屋里，反正我一直这么干。","今天的数据我看过了。……就那样吧。明天见。"];
  var flowLines=led.slice().reverse().map(function(l){return l.reason+"（"+(l.delta>=0?"+":"")+l.delta+" "+(l.kind==="gold"?"G":"分")+"）";});
  var hash=0;for(var i=0;i<date.length;i++)hash+=date.charCodeAt(i);
  return{date:date,hasActivity:hasActivity,headline:headline,
    todosDone:dayTodos.filter(function(t){return t.done;}).length,todosTotal:dayTodos.length,
    workDoneTitles:workDone.map(function(w){return w.title;}),goldDelta:goldDelta,pointsDelta:pointsDelta,
    newAchievementNames:achNames,redemptionNames:reds.map(function(r){return r.rewardName;}),
    pomodoros:pomos,habitChecks:habitChecks,studyCount:studyCount,reviewDone:reviewDone,financeCount:financeCount,workoutMinutes:wos.reduce(function(a,w){return a+w.minutes;},0),
    expenseYuan:expenseYuan,incomeYuan:incomeYuan,tomorrowWork:tomorrowWork,tomorrowTodos:tomorrowTodos,
    moodName:moodName,sebLine:sebPool[hash%sebPool.length],flowLines:flowLines};
}

/* ============ 鹈鹕报道：四档模式 + 人物台词池 + 按日存档（newsDays） ============ */
/* 档位按「查看日期 + 当前时间」定：今天 05–11 今日开场 / 11–18 农场动态 / 18–次日05 收工闲谈；过去某天 那天的小镇（读存档，不重算不改写） */
function newsModeFor(date){
  if(date<todayStr())return "past";
  if(date>todayStr())return "morning"; /* 未来日期只有安排可摆，按开场档展示 */
  var h=new Date().getHours();
  if(h>=5&&h<11)return "morning";
  if(h>=11&&h<18)return "daytime";
  return "evening";
}
var NEWS_SUBTITLES={morning:"今日开场",daytime:"农场动态",evening:"收工闲谈",past:"那天的小镇"};

/* 人物评论台词池按档分开：早间只陈述安排、白天只说事实（{fact} 替换为今天最新一条记录）、晚间松弛收尾。
   只许事实陈述或人物语气，禁止鸡汤、励志、说教。低落日（depressed/nervous/sleepy）强制只从 gentle 温和池出，与悬浮小人同一套温和门。 */

/* 当天零记录时的评论：晚间档专用（塞巴斯蒂安为用户定稿原话，海莉/莱纳斯同调子）；白天档另有一组「还没有记录」 */
var NEWS_EMPTY_LINES={
 sebastian:"今天没留下记录。也行，不是每天都得有新闻。",

};
function newsHash(str){var h=0;for(var i=0;i<str.length;i++)h=(h*31+str.charCodeAt(i))|0;return Math.abs(h);}
function newsMoodLow(date){var m=null;S.moods.forEach(function(x){if(x.date===date)m=x;});return !!(m&&LOW_MOODS[m.mood]);}
/* 组装一份报道快照：items=条目摘要，comment=人物评论（说话人+文本），goldDelta/pointsDelta=当日收支（hasFlow 为假时不显示收支行） */
function buildNewsSnapshot(date,mode){
  var n=eveningNews(date);
  var items=[];
  if(mode==="morning"){
    var todos=S.todos.filter(function(x){return x.date===date&&!x.done;});
    if(todos.length)items.push("今日待办 "+todos.length+" 件："+todos.map(function(x){return x.text;}).join("、"));
    var anch=anchorsForDate(date);
    if(anch.length)items.push("今日锚点："+anch.map(function(a){return a.text;}).join("、"));
    var work=S.workItems.filter(function(w){return !w.done&&(w.dueDate===date||w.planDate===date);});
    if(work.length)items.push("今日工作事项："+work.map(function(w){return w.title+((w.planDate===date&&w.dueDate!==date)?"（拟今日办理）":(w.dueDate===date?"（今日到期）":""));}).join("、"));
    if(date===todayStr()){
      var cyc=S.cycles.filter(function(c){return c.active&&c.nextDue===date;});
      if(cyc.length)items.push("今日到期的周期事务："+cyc.map(function(c){return c.name;}).join("、"));
    }
  }else{
    if(n.todosTotal>0)items.push("每日待办完成 "+n.todosDone+"/"+n.todosTotal+" 件");
    if(n.workDoneTitles.length)items.push("工作事务交差 "+n.workDoneTitles.length+" 项："+n.workDoneTitles.join("、"));
    if(n.habitChecks>0)items.push("习惯打卡 "+n.habitChecks+" 次");
    if(n.studyCount>0)items.push("书房记录 "+n.studyCount+" 条");
    if(n.reviewDone)items.push("写了每日复盘");
    if(n.workoutMinutes>0)items.push("运动 "+n.workoutMinutes+" 分钟");
    if(n.incomeYuan>0||n.expenseYuan>0)items.push("现金账本：收入 ¥"+n.incomeYuan+"，支出 ¥"+n.expenseYuan);
    if(n.newAchievementNames.length)items.push("新解锁成就："+n.newAchievementNames.join("、"));
    if(n.redemptionNames.length)items.push("今日已兑换："+n.redemptionNames.join("、"));
  }
  var hasAct=mode==="morning"?items.length>0:n.hasActivity;
  /* 今天最新的一条记录，白天档评论跟着它说一句事实性的话 */
  var fact="";
  if(n.flowLines.length)fact=n.flowLines[n.flowLines.length-1];
  else if(n.workDoneTitles.length)fact="工作交差了「"+n.workDoneTitles[n.workDoneTitles.length-1]+"」";
  else if(n.todosDone>0)fact="完成了 "+n.todosDone+" 件待办";
  var seed=newsHash(date+"|"+mode+"|"+items.join("~"));
  var ch=NEWS_CHARS[seed%3];
  var low=(date===todayStr())?lowMoodDay():newsMoodLow(date);
  var text;
  if(mode==="evening"&&!hasAct)text=NEWS_EMPTY_LINES[ch];
  else if(mode==="daytime"&&!hasAct)text=NEWS_EMPTY_DAYTIME[ch];
  else if(low){var gp=NEWS_LINES.gentle[ch];text=gp[seed%gp.length];}
  else{var pool=(NEWS_LINES[mode]&&NEWS_LINES[mode][ch])?NEWS_LINES[mode][ch]:NEWS_LINES.evening[ch];text=pool[seed%pool.length];}
  if(mode==="daytime"&&hasAct)text=text.split("{fact}").join(fact||"今天有了新记录");
  return{date:date,mode:mode,items:items,hasActivity:hasAct,
    comment:{char:ch,name:NEWS_CHAR_NAMES[ch],text:text},
    goldDelta:n.goldDelta,pointsDelta:n.pointsDelta,
    hasFlow:S.ledger.some(function(l){return l.date===date;}),
    moodName:n.moodName,finalized:false,uAt:Date.now()};
}
function findNewsDay(date){for(var i=0;i<S.newsDays.length;i++)if(S.newsDays[i].date===date)return S.newsDays[i];return null;}
function upsertNewsDay(snap){
  var old=findNewsDay(snap.date);
  if(old){
    var same=JSON.stringify([old.mode,old.items,old.comment,old.goldDelta,old.pointsDelta,old.hasFlow,old.finalized])
      ===JSON.stringify([snap.mode,snap.items,snap.comment,snap.goldDelta,snap.pointsDelta,snap.hasFlow,snap.finalized]);
    if(same)return false;
    snap.uAt=Date.now();
    S.newsDays[S.newsDays.indexOf(old)]=snap;
  }else{
    S.newsDays.push(snap);
  }
  S.newsDays.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  return true;
}
/* 新鲜度修正日：这一天（及今天）若存档是「无事发生」的定稿，但现算已有活动，说明定稿时漏记了别处来源，以现算为准 */
var NEWS_FIX_DATE="2026-10-22";
/* 取某天的报道：今天首次打开即生成存档，白天档随新记录刷新；进入晚间档（18:00 后）定稿，定稿后不再随记录变动。
   过去日期只读存档；无存档（旧数据）按现有记录临时重算展示，渲染层标注「当时未存档」。 */
function newsForDate(date){
  var mode=newsModeFor(date);
  var stored=findNewsDay(date);
  if(mode==="past"){
    if(stored){
      if(date===NEWS_FIX_DATE&&stored.hasActivity===false){
        var pfresh=buildNewsSnapshot(date,"evening");
        if(pfresh.hasActivity){pfresh.finalized=true;if(upsertNewsDay(pfresh))save();return{snap:pfresh,archived:true,unarchived:false};}
      }
      return{snap:stored,archived:true,unarchived:false};
    }
    return{snap:buildNewsSnapshot(date,"evening"),archived:false,unarchived:true};
  }
  if(stored&&stored.finalized){
    if(stored.hasActivity===false){
      var tfresh=buildNewsSnapshot(date,mode);
      if(tfresh.hasActivity){tfresh.finalized=true;if(upsertNewsDay(tfresh))save();return{snap:tfresh,archived:false,unarchived:false};}
    }
    return{snap:stored,archived:true,unarchived:false};
  }
  var snap=buildNewsSnapshot(date,mode);
  if(mode==="evening"&&new Date().getHours()>=18)snap.finalized=true;
  if(upsertNewsDay(snap))save();
  return{snap:snap,archived:false,unarchived:false};
}
