/* 纯函数：不区分大小写子串匹配；每类最多 6 条，总数上限 30 条 */
function globalSearch(q){
  var needle=String(q||"").trim().toLowerCase();
  if(!needle)return [];
  var out=[];
  function hit(s){return String(s==null?"":s).toLowerCase().indexOf(needle)>=0;}
  function push(page,arg,title,snippet){if(out.length<30)out.push({page:page,arg:arg,title:title,snippet:snippet||""});}
  var n=0;
  (S.memos||[]).forEach(function(m){if(n>=6||out.length>=30)return;if(hit(m.title)||hit(m.content)){push("memo",null,String(m.title||"").trim()||"无标题备忘录",String(m.content||"").slice(0,40));n++;}});
  n=0;(S.todos||[]).forEach(function(t){if(n>=6||out.length>=30)return;if(hit(t.text)){push("plan",null,t.text||"",t.date||"");n++;}});
  n=0;(S.workItems||[]).forEach(function(w){if(n>=6||out.length>=30)return;if(hit(w.title)||hit(w.note)){var kindPage={admin:"office",yibao:"medical",banzheng:"cert",office:"office",medical:"medical",cert:"cert"}[w.kind]||"office";push(kindPage,null,w.title||"",w.note||w.category||"");n++;}});
  n=0;(S.studyTopics||[]).forEach(function(t){if(n>=6||out.length>=30)return;if(hit(t.title)||hit(t.notes)||hit(t.nextTry)){push("study",null,t.title||"","");n++;}});
  n=0;(S.studyLogs||[]).forEach(function(l){if(n>=6||out.length>=30)return;
    var host="";if(l.url){try{host=new URL(l.url).hostname;}catch(e){}}
    if(hit(l.content)||hit(l.linkTitle)||(host&&hit(host))){
      var tp=findById(S.studyTopics,l.topicId);
      push("study",null,tp?tp.title:"学习记录",l.content||l.linkTitle||"");n++;}});
  n=0;(S.curiosities||[]).forEach(function(c){if(n>=6||out.length>=30)return;if(hit(c.text)){push("study",null,"好奇",c.text||"");n++;}});
  n=0;(S.financeTx||[]).forEach(function(t){if(n>=6||out.length>=30)return;if(hit(t.note)||hit(t.cat)||hit(t.title)||hit(t.category)){push("finance",null,t.note||t.cat||t.title||t.category||"记账",(t.cat||t.category||"")+" ¥"+fmtYuan(t.amountCents||0));n++;}});
  if(Array.isArray(S.friends)){n=0;S.friends.forEach(function(fr){if(n>=6||out.length>=30)return;if(hit(fr.name)||hit(fr.note)){push("friends",null,fr.name||"",fr.note||"");n++;}});}
  return out;
}

/* 农场天气特效层：按 profile.fxOn 与已拥有状态生成元素（总数封顶 20 个）；减少动态时不生成任何子元素 */
function renderFx(){
  var layer=document.getElementById("fx-layer");if(!layer)return;
  var html="";
  var reduce=false;
  try{reduce=!!(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches);}catch(e){}
  if(!reduce&&typeof S!=="undefined"&&S&&S.profile){
    var fx=S.profile.fxOn||{};
    var owned=function(k){return S.goldOwned.indexOf(k)>=0||(S.merchantOwned||[]).indexOf(k)>=0;};
    var els=[];
    if(fx.firefly&&owned("fx_firefly")){
      for(var i=0;i<12;i++)els.push('<span class="fx-firefly" style="left:'+((i*37)%97)+'%;top:'+(((i*23)%78)+8)+'%;animation-duration:'+(6+(i%5)*1.7).toFixed(1)+'s;animation-delay:-'+(i*1.3).toFixed(1)+'s"></span>');
    }
    if(fx.meteor&&owned("fx_meteor")){
      for(var j=0;j<3;j++)els.push('<span class="fx-meteor" style="left:'+(52+j*16)+'%;top:'+(3+j*9)+'%;animation-duration:'+(9+j*4)+'s;animation-delay:'+(j*3.7).toFixed(1)+'s"></span>');
    }
    if(fx.aurora&&owned("fx_aurora")){
      for(var a=0;a<3;a++)els.push('<span class="fx-aurora" style="left:'+(8+a*26)+'%;animation-duration:'+(11+a*3)+'s;animation-delay:-'+(a*2.9).toFixed(1)+'s"></span>');
    }
    if(fx.petal&&owned("fx_petal")){
      var petalCols=["#f6a8c8","#f28bb4","#fbd0e0","#ee7fa8"];
      for(var q=0;q<8;q++)els.push('<span class="fx-leaf" style="left:'+((q*17)%94)+'%;background:'+petalCols[q%4]+';border-radius:60% 0 60% 0;animation-duration:'+(8+(q%4)*1.6).toFixed(1)+'s;animation-delay:-'+(q*1.9).toFixed(1)+'s"></span>');
    }
    if(fx.leaves&&owned("fx_leaves")){
      var leafCols=["#d9762e","#c2543a","#e0a832","#a8552e"];
      for(var k=0;k<8;k++)els.push('<span class="fx-leaf" style="left:'+((k*13)%95)+'%;background:'+leafCols[k%4]+';animation-duration:'+(7+(k%4)*1.9).toFixed(1)+'s;animation-delay:-'+(k*1.7).toFixed(1)+'s"></span>');
    }
    html=els.slice(0,20).join("");
  }
  layer.innerHTML=html;
}

var BUNDLE_ITEMS=[
  {key:"workout",label:"运动",unit:"次",target:12},
  {key:"work",label:"办结工作",unit:"件",target:15},
  {key:"study",label:"书房记录",unit:"条",target:8},
  {key:"finDays",label:"记账天数",unit:"天",target:20},
  {key:"reviewDays",label:"每日复盘",unit:"天",target:10},
  {key:"habit30",label:"习惯打卡 30 次",unit:"次",target:30}
];
var SEASON_ZH={spring:"春",summer:"夏",autumn:"秋",winter:"冬"};
var JUNIMO_BUNDLE_COLORS=["green","red","blue","yellow","purple","orange"];
function seasonKeyOf(date){
  var y=+date.slice(0,4),m=+date.slice(5,7);
  if(m>=3&&m<=5)return y+"-spring";
  if(m>=6&&m<=8)return y+"-summer";
  if(m>=9&&m<=11)return y+"-autumn";
  return (m===12?y:y-1)+"-winter";
}
function seasonRangeOf(key){
  var p=key.split("-"),y=+p[0],s=p[1];
  if(s==="spring")return{start:key.slice(0,4)+"-03-01",end:key.slice(0,4)+"-05-31"};
  if(s==="summer")return{start:key.slice(0,4)+"-06-01",end:key.slice(0,4)+"-08-31"};
  if(s==="autumn")return{start:key.slice(0,4)+"-09-01",end:key.slice(0,4)+"-11-30"};
  var febEnd=new Date(y+1,2,0).getDate();
  return{start:y+"-12-01",end:(y+1)+"-02-"+pad2(febEnd)};
}
function seasonLabelOf(key){var p=key.split("-");return p[0]+" 年"+SEASON_ZH[p[1]]+"季";}
function prevSeasonKeyOf(key){var r=seasonRangeOf(key);return seasonKeyOf(shiftDate(r.start,-1));}
function bundleCounts(start,end){
  function inR(d){return !!d&&d>=start&&d<=end;}
  function daySet(arr){var s={};arr.forEach(function(r){if(inR(r.date))s[r.date]=1;});return Object.keys(s).length;}
  return{
    workout:S.workouts.filter(function(w){return inR(w.date);}).length,
    work:S.workItems.filter(function(w){return w.done&&inR(w.doneDate);}).length,
    study:S.studyLogs.filter(function(l){return inR(l.date);}).length,
    finDays:daySet(S.financeTx.filter(function(t){return t.date>=STARDROP_BASE;})),
    reviewDays:daySet(S.reviews),
    habit30:S.habitLogs.filter(function(l){return inR(l.date);}).length
  };
}
function bundleProgressOf(key){
  var r=seasonRangeOf(key);var c=bundleCounts(r.start,r.end);
  var met=0;BUNDLE_ITEMS.forEach(function(it){if((c[it.key]||0)>=it.target)met++;});
  return{counts:c,met:met,complete:met===BUNDLE_ITEMS.length};
}
function bundlePanelHtml(){
  var curKey=seasonKeyOf(todayStr());var cur=bundleProgressOf(curKey);
  var rows=BUNDLE_ITEMS.map(function(it,i){
    var n=cur.counts[it.key]||0;var met=n>=it.target;
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed #d8c491">'
      +'<span style="flex:1"><b>'+it.label+'</b> <span class="dim small">'+n+" / "+it.target+" "+it.unit+"</span></span>"
      +(met?'<span style="display:inline-flex;align-items:center;gap:6px">'+junimoSvg(JUNIMO_BUNDLE_COLORS[i%JUNIMO_BUNDLE_COLORS.length],22)+'<span class="small" style="color:#3d7a24">已被祝尼魔搬走</span></span>'
           :'<span class="small dim">还差 '+(it.target-n)+" "+it.unit+"</span>")
      +"</div>";
  }).join("");
  var head='<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px"><b class="font-pixel" style="font-size:16px">'+seasonLabelOf(curKey)+'收集包</b>'
    +(cur.complete?'<span style="display:inline-flex;align-items:center;gap:5px">'+pixIcon("star",17)+'<span class="small">已集齐 · +30 分（见账本）</span></span>'
                  :'<span class="small dim">完成 '+cur.met+" / "+BUNDLE_ITEMS.length+" 条 · 集齐 +30 分</span>")
    +"</div>";
  /* 存档：从有记录的最早季节到上一季，只列有动静或集齐的 */
  var firstKey=seasonKeyOf(farmEarliestDate()||todayStr());
  var arch=[];var k=curKey;var guard=0;
  while(k!==firstKey&&guard<16){k=prevSeasonKeyOf(k);var pr=bundleProgressOf(k);var any=BUNDLE_ITEMS.some(function(it){return (pr.counts[it.key]||0)>0;});if(any||pr.complete)arch.push({key:k,pr:pr});guard++;}
  var archHtml=arch.length===0?"":'<div style="margin-top:10px"><div class="small" style="font-weight:600;margin-bottom:4px">往季存档</div>'
    +arch.map(function(a){return '<div style="display:flex;align-items:center;gap:8px;padding:3px 0"><span style="flex:1" class="small">'+seasonLabelOf(a.key)+'</span>'+(a.pr.complete?'<span style="display:inline-flex;align-items:center;gap:5px">'+pixIcon("star",15)+'<span class="small">已集齐</span></span>':'<span class="small dim">完成 '+a.pr.met+" / "+BUNDLE_ITEMS.length+" 条</span>")+"</div>";}).join("")+"</div>";
  return panel("季节收集包","basket",head+rows+archHtml);
}

var STARDROPS=[

  {key:"todos300",label:"累计完成待办 300 件"},

function distinctDaysOf(arr){var s={};(arr||[]).forEach(function(r){if(r&&r.date)s[r.date]=1;});return Object.keys(s).length;}
function farmEarliestDate(){
  var min=null;
  function take(d){if(d&&typeof d==="string"&&(!min||d<min))min=d;}

/* 锚点全勤日：当日适用锚点（启用且当日排班）总数 > 0，且全部在 anchorLogs 中为 done */
function anchorPerfectDays(){

    if(list.length>0&&list.every(function(a){return anchorStatus(a.id,d)==="done";}))days[d]=1;
    d=shiftDate(d,1);
  }

}
function skillDailyRaw(key){
  var raw={};
  function add(date,xp){if(date&&date>=SKILL_BASE)raw[date]=(raw[date]||0)+xp;}
  if(key==="body")S.workouts.forEach(function(w){add(w.date,12);});
  else if(key==="mind")S.studyLogs.forEach(function(l){add(l.date,8);});
  else if(key==="work")S.workItems.forEach(function(w){if(w.done)add(w.doneDate,10);});
  else if(key==="home")S.financeTx.forEach(function(t){add(t.date,2);});
  else if(key==="diligence"){
    S.todos.forEach(function(t){if(t.done)add(t.date,6);});
    S.habitLogs.forEach(function(l){add(l.date,4);});
    var perfect=anchorPerfectDays();
    Object.keys(perfect).forEach(function(d){add(d,10);});
  }
  return raw;
}
function skillXp(key){

var TV_CHANNELS=[{key:"weather",label:"天气"},{key:"yiji",label:"今日宜忌"},{key:"tips",label:"生活窍门"}];

function tvWeatherCodeText(code){
  var c=Number(code);
  if(c===0)return "晴";
  if(c===1)return "晴间多云";
  if(c===2)return "多云";
  if(c===3)return "阴";
  if(c===45||c===48)return "有雾";
  if(c===51||c===53||c===55)return "毛毛雨";
  if(c===56||c===57)return "冻毛毛雨";
  if(c===61)return "小雨";
  if(c===63)return "中雨";
  if(c===65)return "大雨";
  if(c===66||c===67)return "冻雨";
  if(c===71)return "小雪";
  if(c===73)return "中雪";
  if(c===75)return "大雪";
  if(c===77)return "雪粒";
  if(c===80)return "阵雨";
  if(c===81)return "阵雨";
  if(c===82)return "大阵雨";
  if(c===85||c===86)return "阵雪";
  if(c===95)return "雷阵雨";
  if(c===96||c===99)return "雷阵雨伴冰雹";
  return "天气状况不明";
}
function tvParseWeather(j){
  var d=j&&j.daily;if(!d)return null;
  var codes=d.weather_code||d.weathercode;
  var maxs=d.temperature_2m_max,mins=d.temperature_2m_min;
  if(!codes||!maxs||!mins||codes.length===0||maxs.length===0||mins.length===0)return null;
  var lo=Math.round(Number(mins[0])),hi=Math.round(Number(maxs[0]));
  if(!isFinite(lo)||!isFinite(hi))return null;
  return "成都今日"+tvWeatherCodeText(codes[0])+"，"+lo+"–"+hi+"°C";
}
function tvNearestTerm(today){
  var best=null;
  var years=[["2026",TERM_2026],["2027",TERM_2027]];
  years.forEach(function(y){
    TERM_NAMES.forEach(function(n,i){
      var date=y[0]+"-"+y[1][i];
      var diff=daysUntil(today,date);if(diff==null)return;
      var ad=Math.abs(diff);
      if(!best||ad<best.ad)best={name:n,fact:TERM_FACTS[i],date:date,ad:ad,diff:diff};
    });
  });
  return best;
}
function tvFallbackWeatherText(today){
  var s=seasonOf(today);
  var t=tvNearestTerm(today);
  if(!t)return "天气信号暂时收不到。今天是"+s.season+"季。";
  var when=t.diff===0?"今天就是"+t.name:(t.diff>0?"再过 "+t.diff+" 天是"+t.name:"已过去 "+(-t.diff)+" 天");
  return "天气信号暂时收不到。距今最近的节气是"+t.name+"（"+t.date+"，"+when+"）。"+t.fact+"现在是"+s.season+"季。";
}
function tvWeatherUrl(){
  return "https://api.open-meteo.com/v1/forecast?latitude=30.67&longitude=104.06&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai&forecast_days=1";
}
/* 拉天气：成功返回事实句，任何失败（离线/超时/接口异常/数据不合格式）都返回节气回退句，永不 reject */
function tvFetchWeatherText(fetchFn,today){
  var f=fetchFn||(typeof fetch!=="undefined"?fetch:null);
  if(!f)return Promise.resolve(tvFallbackWeatherText(today));
  var timeout=new Promise(function(_,rej){setTimeout(function(){rej(new Error("tv-weather-timeout"));},8000);});
  var work=Promise.resolve().then(function(){return f(tvWeatherUrl());}).then(function(r){
    if(!r||r.ok===false)throw new Error("tv-weather-http");
    return r.json();
  }).then(function(j){
    var text=tvParseWeather(j);
    if(!text)throw new Error("tv-weather-format");
    return text;
  });
  return Promise.race([work,timeout]).catch(function(){return tvFallbackWeatherText(today);});
}
function tvStartWeather(){
  if(typeof document==="undefined")return;
  var today=todayStr();
  if(tvWeatherCache.date===today&&tvWeatherCache.text){tvApplyWeatherText(tvWeatherCache.text);return;}
  if(tvWeatherCache.loading)return;
  tvWeatherCache.loading=true;
  tvFetchWeatherText(null,today).then(function(text){
    tvWeatherCache={date:today,text:text,loading:false};
    tvApplyWeatherText(text);
  });
}

function tvYijiText(today,anchors,workCount,todoUndone,lowMood){

  if(hasBarre){var ba=anchorBy("芭杆");yi.push("芭杆（今天有芭杆锚点"+(ba&&ba.time?"，"+ba.time+" 开始":"")+"）");}

  if(hasMenu)yi.push("定食谱和采购（今天有这个锚点）");

  if(todoUndone>0)yi.push("做完手头待办（今天还有 "+todoUndone+" 件未完成）");

/* 每日计划分组（纯函数）：today=今天的全部待办（原顺序）；overdue=过期未完成（日期升序）；
   upcoming=未来待办按日期升序分组，daysLeft 为距今天数。已完成的历史待办不进这三组。 */
function planGroups(){
  var today=todayStr();
  var todayList=[],overdue=[],byDate={};
  S.todos.forEach(function(t){
    if(t.date===today)todayList.push(t);
    else if(t.date<today){if(!t.done)overdue.push(t);}
    else{if(!byDate[t.date])byDate[t.date]=[];byDate[t.date].push(t);}
  });
  overdue.sort(function(a,b){return a.date<b.date?-1:(a.date>b.date?1:0);});
  var upcoming=Object.keys(byDate).sort().map(function(d){
    return {date:d,daysLeft:daysUntil(today,d),items:byDate[d]};
  });
  return {today:todayList,overdue:overdue,upcoming:upcoming};
}

function planPage(){
  var today=todayStr();

  var anchorsResolved=todayAnchors.filter(function(a){return !!anchorStatus(a.id,today);}).length;

  h+=panel("每日计划 · 今天","backpack",

    +'<form class="row wrap" style="margin-bottom:12px" data-form="todo-add"><input class="pix-input" name="text" style="flex:1;min-width:140px" aria-label="新待办内容" placeholder="新待办"><input type="date" class="pix-input" name="date" style="width:170px" aria-label="待办日期" value="'+today+'"><button type="submit" class="pix-btn pix-btn-green" aria-label="添加待办">＋ 添加</button></form>'
    +(groups.today.length===0?emptyState("leaf","今天还没有待办。")
      :'<ul style="list-style:none;margin:0;padding:0">'+groups.today.map(function(t){return planListRowHtml(t,"");}).join("")+"</ul>"));
  if(groups.overdue.length>0){
    h+=panel("逾期","calendar",
      '<div class="row items-center" style="gap:8px;margin-bottom:4px"><span class="pix-tag" style="background:#f8cfc9;border-color:#b03a2e;color:#8c2b20">'+groups.overdue.length+" 件</span></div>"
      +'<ul style="list-style:none;margin:0;padding:0">'+groups.overdue.map(function(t){
        return planListRowHtml(t,'<span class="xs dim">'+t.date+'</span><span class="xs" style="color:#a33">已逾期 '+daysUntil(t.date,today)+" 天</span>");
      }).join("")+"</ul>");
  }
  var next="";
  groups.upcoming.forEach(function(g){
    var gp=g.date.split("-").map(Number);
    next+='<div class="font-pixel" style="font-size:15px;margin:12px 0 4px">'+gp[1]+" 月 "+gp[2]+" 日 · 星期"+weekdayOf(g.date)+" · 还有 "+g.daysLeft+" 天</div>"
      +'<ul style="list-style:none;margin:0;padding:0">'+g.items.map(function(t){return planListRowHtml(t,"");}).join("")+"</ul>";

  h+=panel("接下来","calendar",next);

/* 心情月历网格（月份切换沿用 mood-month / ui.moodMonth）：cellAct 决定格子点击行为，
   心情页用 mood-edit（直接开编辑弹窗），复盘页用 mood-day-jump（点某天直达那天的复盘） */
function moodMonthGridHtml(cellAct){
  var today=todayStr();
  var month=ui.moodMonth||today.slice(0,7);
  var byDate={};S.moods.forEach(function(m){byDate[m.date]=m;});
  var p=month.split("-").map(Number);var yy=p[0],mm=p[1];
  var firstDow=(new Date(yy,mm-1,1).getDay()+6)%7;
  var daysInMonth=new Date(yy,mm,0).getDate();
  var cells=[];for(var i=0;i<firstDow;i++)cells.push(null);
  for(var d=1;d<=daysInMonth;d++)cells.push(month+"-"+pad2(d));
  var monthHasAny=S.moods.some(function(m){return m.date.indexOf(month)===0;});
  var weekHead=["一","二","三","四","五","六","日"];
  return '<div class="row items-center" style="justify-content:space-between;margin-bottom:8px"><button type="button" class="pix-btn" data-act="mood-month" data-n="-1" aria-label="上一个月">‹ 上月</button><span class="font-pixel" style="font-size:16px">'+yy+" 年 "+mm+' 月</span><button type="button" class="pix-btn" data-act="mood-month" data-n="1" aria-label="下一个月">下月 ›</button></div>'
    +'<div class="cal-grid" style="text-align:center;margin-bottom:4px" aria-hidden="true">'+weekHead.map(function(w){return '<div class="font-pixel xs" style="padding:2px 0">周'+w+"</div>";}).join("")+"</div>"
    +'<div class="cal-grid">'+cells.map(function(date,i){
      if(!date)return '<div key="e'+i+'"></div>';
      var entry=byDate[date];var def=entry?MOOD_BY_KEY[entry.mood]:null;var isToday=date===today;
      return '<button type="button" class="cal-cell'+(isToday?" today":"")+'" data-act="'+cellAct+'" data-date="'+date+'" aria-label="'+date+(entry&&def?"，心情"+def.label:"")+'"><span class="font-num" style="font-size:10px;line-height:1">'+Number(date.slice(8))+"</span>"+(def?chickSvg(def,26):"")+"</button>";
    }).join("")+"</div>"
    +(monthHasAny?"":'<p class="small" style="text-align:center;margin:12px 0 0;color:#7a5a2a">这个月还没有心情记录。</p>');
}

/* ============ 页面：农场日历（双空间 · 周/月/日三层视图） ============
   纯读现有数据聚合展示（todos / anchors / cycles / workItems / moods / studyLogs /
   workouts / reviews），零新增存储字段。硬规则：安排 ≠ 记录——视图里能勾的只有
   待办、锚点、周期事务、工作事项本体，勾掉任何计划永不生成健身/学习记录；
   运动锚点只给「记一笔健身」预填入口，用户确认保存才生成记录。 */
function calFocusDate(){return ui.calDate||todayStr();}
function calMoodOf(date){var m=null;S.moods.forEach(function(x){if(x.date===date)m=x;});return m;}
function calCyclesDueOn(date){return S.cycles.filter(function(c){return c.active&&c.nextDue===date;});}
function calExerciseType(a){
  var text=(a.text||"")+" "+(a.note||"");
  for(var i=0;i<WORKOUT_TYPES.length;i++){if(WORKOUT_TYPES[i]!=="其他"&&text.indexOf(WORKOUT_TYPES[i])>=0)return WORKOUT_TYPES[i];}
  if(/运动|健身|锻炼|跑步|跳操|拉伸/.test(text))return "其他";
  return null;
}
function calExerciseMinutes(type){return type==="游泳"?60:(type==="芭杆"?40:30);}
/* 运动类锚点勾完后旁出的快捷行：只打开预填表单，确认才存，不确认不生成 */
function calExerciseRowsHtml(date){
  var rows="";
  anchorsForDate(date).forEach(function(a){
    if(anchorStatus(a.id,date)!=="done")return;
    var type=calExerciseType(a);if(!type)return;
    rows+='<div class="cal-row" style="border-bottom:0"><span class="xs dim">「'+esc(a.text)+'」已完成，要记一笔健身吗？</span>'
      +'<button type="button" class="pix-btn pix-btn-ghost" data-act="cal-workout-open" data-type="'+type+'" data-date="'+date+'" data-minutes="'+calExerciseMinutes(type)+'" aria-label="记一笔健身：'+esc(a.text)+'">记一笔健身（'+type+" · "+calExerciseMinutes(type)+' 分钟）</button></div>';
  });
  return rows;
}
function calTodoRowHtml(t,drag){
  return '<div class="cal-row"'+(drag&&!t.done?' draggable="true" data-drag-kind="todo" data-drag-id="'+t.id+'"':"")+'>'
    +'<button type="button" style="background:none;border:0;cursor:pointer;padding:0;display:inline-flex" data-act="todo-toggle" data-id="'+t.id+'" aria-label="'+(t.done?"取消完成待办 ":"完成待办 ")+esc(t.text)+'">'+pixIcon(t.done?"checkBadge":"boxEmpty",19)+"</button>"
    +'<span style="flex:1;min-width:60px"'+(t.done?' class="strike dim"':"")+">"+esc(t.text)+"</span>"
    +'<button type="button" class="xs" style="padding:0 4px;color:#8a6a45;background:none;border:0;cursor:pointer;font-family:inherit" data-act="todo-edit" data-id="'+t.id+'" aria-label="编辑待办 '+esc(t.text)+'">编辑</button>'
    +'<label class="xs dim" style="display:inline-flex;align-items:center;gap:4px">改期<input type="date" class="pix-input cal-move" data-change="cal-move-todo" data-id="'+t.id+'" value="'+t.date+'" aria-label="把待办「'+esc(t.text)+'」改到哪一天"></label></div>';
}
function calCycleRowHtml(c){
  var locked=cycleDoneThisPeriod(c);
  return '<div class="cal-row">'+pixIcon("leaf",17)
    +'<span style="flex:1;min-width:60px"><b>'+esc(c.name)+"</b></span>"+tag("周期到期","pix-tag-green")

      ?'<span class="xs dim">本期已完成</span><button type="button" class="pix-btn pix-btn-ghost" data-act="cycle-again" data-id="'+c.id+'" aria-label="再记一次 '+esc(c.name)+'（只记历史，不发奖不推进）">再记一次</button>'

    +"</div>";
}
function calWorkRowHtml(w,onDate,drag){

    +'<label class="xs dim" style="display:inline-flex;align-items:center;gap:4px">办理日<input type="date" class="pix-input cal-move" data-change="cal-move-work" data-id="'+w.id+'" value="'+(planDayOf(w)||"")+'" aria-label="把事项「'+esc(w.title)+'」的办理日改到哪一天"></label></div>';

function calDayHeadHtml(date,withChick){

function calWeekDayLife(date){

}
function calMonthHtml(space,focus){
  var month=focus.slice(0,7);var p=month.split("-").map(Number);var yy=p[0],mm=p[1];
  var firstDow=(new Date(yy,mm-1,1).getDay()+6)%7;
  var dim=new Date(yy,mm,0).getDate();
  var cells=[];for(var i=0;i<firstDow;i++)cells.push(null);
  for(var d=1;d<=dim;d++)cells.push(month+"-"+pad2(d));
  var weekHead=["一","二","三","四","五","六","日"];
  var today=todayStr();
  var grid='<div class="cal-grid" style="text-align:center;margin-bottom:4px" aria-hidden="true">'+weekHead.map(function(w){return '<div class="font-pixel xs" style="padding:2px 0">周'+w+"</div>";}).join("")+"</div>"
    +'<div class="cal-grid">'+cells.map(function(date,i){
      if(!date)return '<div key="e'+i+'"></div>';
      var parts=[],dot=false,chick="";
      var fest=festivalOf(date);
      if(space==="work"){
        var planN=S.workItems.filter(function(w){return !w.done&&planDayOf(w)===date;}).length;
        var dueN=S.workItems.filter(function(w){return !w.done&&w.dueDate===date;}).length;
        if(planN)parts.push("办理 "+planN);
        if(dueN){parts.push("截止 "+dueN);dot=true;}
      }else{
        var tdN=S.todos.filter(function(t){return t.date===date;}).length;
        var cyN=calCyclesDueOn(date).length;
        var m=calMoodOf(date);var def=m?MOOD_BY_KEY[m.mood]:null;
        if(def)chick=chickSvg(def,22);
        if(tdN)parts.push("待办 "+tdN);

function calWorkStatsHtml(){

  }).join(" · ");
  var dueIn=S.workItems.filter(function(w){return inR(w.dueDate);});
  var onTime=dueIn.filter(function(w){return w.done&&w.doneDate&&w.doneDate<=w.dueDate;}).length;
  var dueSub=dueIn.length?("按时办结率 "+Math.round(onTime/dueIn.length*100)+"%"):"";

  S.workItems.forEach(function(w){if(!w.done&&w.district)distCount[w.district]=(distCount[w.district]||0)+1;});
  var distTop=Object.keys(distCount).map(function(k){return [k,distCount[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,3);
  var distSub=distTop.map(function(p){return p[0]+" "+p[1];}).join(" · ");

    +(off!==0?'<button type="button" class="pix-btn pix-btn-ghost" data-act="cal-stats-shift" data-n="0" aria-label="回到本期">回到本期</button>':"")
    +"</div>"

    +dailyStats.map(function(d){

        +"<td>"+(d.due?d.due:"—")+"</td><td>"+(d.done?d.done:"—")+"</td></tr>";
    }).join("")
    +"</tbody></table></div>";
  return panel("回顾统计","starfruit",inner);

/* ============ 页面：财务 ============ */
/* 本月小结（纯函数，只读 S.financeTx）：环比/同比 + 分类对比 + 点名区。
   partial（查看的是当前月且未到月末）时全部改用同期口径：本月与对比月都只算 1 日到今天的日号。
   点名基线 = monthKey 之前 3 个自然月的同分类平均（partial 时同样取同期段）。 */
var FIN_VOLATILE_CATS=["服饰","旅行","电子产品","医疗","美妆护肤","美妆和护肤","住房","居住"];
function finMonthSummary(monthKey){
  var tp=monthKey.split("-").map(Number);
  var today=todayStr();
  var partial=(today.slice(0,7)===monthKey)&&Number(today.slice(8,10))<daysInMonth(tp[0],tp[1]-1);
  var cutDay=partial?Number(today.slice(8,10)):31;
  function shiftMonthKey(mk,n){var p=mk.split("-").map(Number);var d=new Date(p[0],p[1]-1+n,1);return d.getFullYear()+"-"+pad2(d.getMonth()+1);}
  function inRange(ds,mk){return ds.indexOf(mk)===0&&(cutDay>=31||Number(ds.slice(8,10))<=cutDay);}
  function sumMonth(mk,cat){
    var s=0;
    S.financeTx.forEach(function(t){if(t.kind==="expense"&&inRange(t.date,mk)&&(cat===undefined||t.category===cat))s+=t.amountCents;});
    return s;
  }
  function hasAny(mk){return S.financeTx.some(function(t){return t.date.indexOf(mk)===0;});}
  function pctOf(cur,base){if(base<=0)return null;return Math.round((cur-base)/base*1000)/10;}
  var prevKey=shiftMonthKey(monthKey,-1),yoyKey=shiftMonthKey(monthKey,-12);
  var total=sumMonth(monthKey);
  var momPct=hasAny(prevKey)?pctOf(total,sumMonth(prevKey)):null;
  var yoyPct=hasAny(yoyKey)?pctOf(total,sumMonth(yoyKey)):null;
  var catSet={};
  S.financeTx.forEach(function(t){if(t.kind==="expense"&&inRange(t.date,monthKey))catSet[t.category]=1;});
  var cats=Object.keys(catSet).map(function(c){
    return{cat:c,cents:sumMonth(monthKey,c),prevCents:sumMonth(prevKey,c)};
  }).sort(function(a,b){return b.cents-a.cents;});
  var baseKeys=[shiftMonthKey(monthKey,-1),shiftMonthKey(monthKey,-2),shiftMonthKey(monthKey,-3)];
  var flags=[];
  cats.forEach(function(c){
    var baseSum=0;baseKeys.forEach(function(bk){baseSum+=sumMonth(bk,c.cat);});
    var base=Math.round(baseSum/3);
    var diff=c.cents-base;
    if(base===0){
      if(c.cents>=20000)flags.push({type:"new",cat:c.cat,cents:c.cents,baseCents:0,diffCents:c.cents});
      return;
    }
    if(c.cents>base*1.3&&diff>=20000){
      var txs=S.financeTx.filter(function(t){return t.kind==="expense"&&t.category===c.cat&&inRange(t.date,monthKey);})
        .sort(function(a,b){return b.amountCents-a.amountCents;});
      var tops=txs.slice(0,2).map(function(t){return{title:t.title,cents:t.amountCents};});
      if(FIN_VOLATILE_CATS.indexOf(c.cat)>=0){
        flags.push({type:"fact",cat:c.cat,cents:c.cents,baseCents:base,diffCents:diff,top:tops.slice(0,1)});
      }else{
        flags.push({type:"over",cat:c.cat,cents:c.cents,baseCents:base,diffCents:diff,pct:Math.round(diff/base*1000)/10,top:tops});
      }
    }
  });
  flags.sort(function(a,b){return b.diffCents-a.diffCents;});
  return{totalCents:total,momPct:momPct,yoyPct:yoyPct,partial:partial,flags:flags,cats:cats};
}

    +'<div class="paper-panel" style="padding:12px"><div class="xs dim">本月支出</div><div class="font-pixel" style="font-size:18px;color:#b03a2e">¥'+fmtYuan(expense)+"</div></div>"

/* 标准 CSV/TSV 解析：处理引号内的逗号、引号内的换行、双引号转义（""）；每条记录带它在文件里的起始行号，报错与核对都能对上原文行 */
function parseCsvRows(text,delim){
  var rows=[],row=[],field="",inQ=false,line=1,rowStart=1;
  function pushField(){row.push(field);field="";}
  function pushRow(){pushField();rows.push({cells:row,line:rowStart});row=[];}
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(inQ){
      if(ch==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQ=false;}
      else{if(ch==="\n")line++;field+=ch;}
    }else if(ch==='"'&&field===""){inQ=true;}
    else if(ch===delim){pushField();}
    else if(ch==="\n"){line++;pushRow();rowStart=line;}
    else if(ch!=="\r"){field+=ch;}
  }
  if(field!==""||row.length>0)pushRow();
  return rows.filter(function(r){return r.cells.some(function(c){return String(c).trim().length>0;});});
}
function handleFinanceImport(file){
  var reader=new FileReader();
  reader.onload=function(){
    var text=String(reader.result||"").replace(/^\uFEFF/,"");
    var firstLine=text.split(/\r?\n/)[0]||"";
    var delim=firstLine.indexOf("\t")>=0?"\t":",";
    var parsed=parseCsvRows(text,delim);
    if(parsed.length<2){ui.finMsg="导入失败：文件里没有数据行。";render();return;}
    var header=parsed[0].cells.map(function(c){return String(c).trim();});
    function find(re){for(var i=0;i<header.length;i++)if(re.test(header[i]))return i;return -1;}
    var idx={date:find(/日期|date/i),title:find(/标题|名称|title|说明/),category:find(/分类|category/),amount:find(/金额|amount/),kind:find(/类型|收支|kind/)};
    if(idx.date<0||idx.amount<0){ui.finMsg="导入失败：表头需要包含「日期」和「金额」两列（可选：标题、分类、类型）。";render();return;}
    var rows=parsed.slice(1).map(function(pr){
      var c=pr.cells.map(function(x){return String(x).trim();});
      return{rowNo:pr.line,date:c[idx.date]||"",title:idx.title>=0?(c[idx.title]||""):"导入记录",category:idx.category>=0?(c[idx.category]||"其他"):"其他",amount:Number(c[idx.amount]||"0"),kind:idx.kind>=0?(c[idx.kind]||"expense"):"expense"};
    });
    var res=null;
    mutate(function(){res=importFinanceRows(rows);});
    ui.finMsg="导入完成：成功 "+res.inserted+" 条"
      +(res.skipped>0?"；跳过完全重复 "+res.skipped+" 条（第 "+res.skippedRows.join("、")+" 行）":"")
      +(res.suspects.length>0?"；疑似重复 "+res.suspects.length+" 条（已导入，请核对）：第 "+res.suspects.join("、")+" 行":"")
      +(res.errors.length>0?"；失败 "+res.errors.length+" 条："+res.errors.slice(0,5).map(function(e){return "第 "+e.row+" 行 "+e.message;}).join("；"):(res.skipped===0&&res.suspects.length===0?"，全部成功。":""));
    render();
  };
  reader.readAsText(file);
}

function workTodayPage(){
  var today=todayStr();
  var open=S.workItems.filter(function(w){return !w.done;});
  var dueTodayItems=open.filter(function(w){return w.dueDate===today;});
  var dueSoonItems=open.filter(function(w){var d=daysUntil(today,w.dueDate);return d!=null&&d>=0&&d<=7;}).sort(function(a,b){return (a.dueDate||"").localeCompare(b.dueDate||"");});
  var outingOpen=open.filter(function(w){return w.outing;});
  var todaySection=open.filter(function(w){return w.dueDate!=null&&w.dueDate<=today;}).sort(function(a,b){return (a.dueDate||"").localeCompare(b.dueDate||"");});
  var upcomingSection=open.filter(function(w){var d=daysUntil(today,w.dueDate);return d!=null&&d>0&&d<=7;}).sort(function(a,b){return (a.dueDate||"").localeCompare(b.dueDate||"");});
  var clusterMap={};outingOpen.forEach(function(w){if(!w.district)return;(clusterMap[w.district]=clusterMap[w.district]||[]).push(w);});
  var clusters=Object.keys(clusterMap).filter(function(k){return clusterMap[k].length>=2;}).map(function(k){return[k,clusterMap[k]];});
  /* 「今日待处理」只统计未完成且 dueDate 非空且 dueDate<=今日 的事项，与下方 todaySection 同集 */
  var focusLists={today:{title:"今日待处理",items:todaySection},dueToday:{title:"今天到期",items:dueTodayItems},due7:{title:"7 天内到期",items:dueSoonItems},outing:{title:"外出事项",items:outingOpen}};
  var focusData=ui.workFocus?focusLists[ui.workFocus]:null;
  var h='<div class="stack">';
  h+=viewTabs("workToday",false);
  /* 今天先做这三件（今日工作页）：只取已接取且 7 天内到期（含已逾期）的未完成事务，按到期越近越前、同日耗时越短越前；仅聚合展示，不存第二份数据 */
  var wFocus=S.workItems.filter(function(w){
    if(w.done||w.stage!=="active"||!w.dueDate)return false;
    var dd=daysUntil(today,w.dueDate);return dd!=null&&dd<=7;
  }).map(function(w){return{id:w.id,title:w.title,due:w.dueDate,est:(w.estMinutes==null?30:w.estMinutes),meta:dueLabel(today,w.dueDate)+(w.estMinutes?" · 约 "+w.estMinutes+" 分钟":"")};});
  wFocus.sort(function(a,b){if(a.due!==b.due)return a.due<b.due?-1:1;return a.est-b.est;});
  wFocus=wFocus.slice(0,3);
  if(wFocus.length>0){
    h+=panel("今天先做这三件","pin",'<ul style="list-style:none;margin:0;padding:0">'+wFocus.map(function(f){
      return '<li class="paper-panel small" style="padding:8px 12px;margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        +'<button type="button" style="background:none;border:0;cursor:pointer;padding:0;display:inline-flex" data-act="work-toggle" data-id="'+f.id+'" aria-label="完成 '+esc(f.title)+'">'+pixIcon("boxEmpty",20)+"</button>"
        +"<b>"+esc(f.title)+"</b>"+tag(f.meta,"pix-tag-green")+"</li>";
    }).join("")+"</ul>");
  }
  h+='<div class="stat-chips" role="group" aria-label="今日工作统计">'
    +statChip("今日待处理",todaySection.length,"today")+statChip("今天到期",dueTodayItems.length,"dueToday")
    +statChip("7天内到期",dueSoonItems.length,"due7")+statChip("外出事项",outingOpen.length,"outing")+"</div>";
  if(focusData){
    h+=panel(focusData.title+" · "+focusData.items.length+" 件","pin",
      '<button type="button" class="pix-btn pix-btn-ghost" style="margin-bottom:12px" data-act="work-focus" data-focus="" aria-label="返回今日工作总览">← 返回总览</button>'
      +(focusData.items.length===0?emptyState("leaf","这一类现在是空的。")
        :'<div class="grid-cards">'+focusData.items.map(function(w){return workCard(w,true);}).join("")+"</div>"));
  }else{
    h+=panel("今日事项","pin",todaySection.length===0?emptyState("seedling","今天没有到期或逾期的事务。")
      :'<div class="grid-cards">'+todaySection.map(function(w){return workCard(w,true);}).join("")+"</div>");
    /* 今日办理安排：按办理日（planDate 有值取 planDate，否则回落 dueDate）聚合，与截止口径分开 */
    var planTodayItems=open.filter(function(w){return planDayOf(w)===today;}).sort(function(a,b){return (a.dueDate||"9999").localeCompare(b.dueDate||"9999");});
    h+=panel("今日办理安排","pinloc",planTodayItems.length===0?'<p class="small dim" style="margin:0">今天没有安排要办理的事项。</p>'
      :'<div class="grid-cards">'+planTodayItems.map(function(w){return workCard(w,true);}).join("")+"</div>");
    h+=panel("即将截止","clock",upcomingSection.length===0?'<p class="small dim" style="margin:0">接下来 7 天没有要截止的事务。</p>'
      :'<div class="grid-cards">'+upcomingSection.map(function(w){return workCard(w,true);}).join("")+"</div>");
    h+=panel("区域联办提醒","map",
      (clusters.length===0?'<p class="small dim" style="margin:0">还没有哪个区攒够两件外出事项。</p>'
        :'<ul style="list-style:none;margin:0;padding:0">'+clusters.map(function(c){
          var med=c[1].filter(function(w){return w.kind==="medical";}).length;
          var cert=c[1].filter(function(w){return w.kind==="cert";}).length;
          return '<li class="paper-panel small" style="padding:8px 12px;margin-bottom:8px">'+esc(c[0])+"区目前有 "+c[1].length+" 件外出事项，其中 "+med+" 件医保、"+cert+' 件办证，可以考虑一次集中办理。<button type="button" class="pix-btn pix-btn-ghost" style="margin-left:8px" data-act="go-region" data-district="'+esc(c[0])+'" aria-label="查看'+esc(c[0])+'区外出事务">去看看 →</button></li>';}).join("")+"</ul>")
      +'<button type="button" class="pix-btn" style="margin-top:12px" data-act="go" data-page="regions" aria-label="打开区域视图">区域视图 →</button>');
    var sortedOpen=open.slice().sort(function(a,b){return (a.dueDate||"9999").localeCompare(b.dueDate||"9999");});
    h+=panel("等待处理 / 未完成事项","inbox",open.length===0?emptyState("sign","没有未完成的事项。")
      :'<div class="grid-cards">'+sortedOpen.map(function(w){return workCard(w,true);}).join("")+"</div>");
  }
  h+="</div>";
  return h;
}

function regionPage(district){
  var openOuting=S.workItems.filter(function(w){return !w.done&&w.outing;});
  var h='<div class="stack">';
  if(!district){
    h+=viewTabs("workToday",true);
    var today=todayStr();
    var URGENCY_RANK={red:0,orange:1,yellow:2};
    var plaques=S.districts.map(function(d){
      var list=openOuting.filter(function(w){return w.district===d.name;}).slice().sort(function(a,b){return (a.dueDate||"9999").localeCompare(b.dueDate||"9999");});
      /* 边框按该区最急事项的 dueDate 紧急度染：逾期或≤3 天红、≤7 天橙、≤14 天浅黄，其余无色 */
      var worst=null;
      list.forEach(function(w){var lv=urgencyLevel(today,w.dueDate);if(lv&&URGENCY_RANK[lv]!=null&&(worst===null||URGENCY_RANK[lv]<URGENCY_RANK[worst]))worst=lv;});
      var border=worst?URGENCY_STYLE[worst].border:"";
      /* 同区多件同一办理日（planDate 有值取 planDate，否则回落 dueDate）→ 一趟办的提示 */

      if(a.done!==b.done)return a.done?1:-1;return (a.dueDate||"9999").localeCompare(b.dueDate||"9999");});

/* ============ JSON 导入恢复（先预览条数，再选合并/覆盖） ============ */
var importPending=null;
var IMPORT_COUNT_KEYS=["todos","workItems","financeTx","habits","habitLogs","reviews","moods","studyTopics","studyLogs","workouts","pomodoros","ledger"];
function handleImportFile(file){
  var reader=new FileReader();
  reader.onload=function(){
    var obj=null;
    try{obj=JSON.parse(String(reader.result||""));}catch(e){}
    if(!obj||typeof obj!=="object"||Array.isArray(obj)||!obj.profile||!obj.wallet){
      modal("导入失败",'<p class="small" style="margin:0">这个文件不像是番鼠农场导出的 JSON 备份，导入已取消，现有数据没动。</p>');
      return;
    }
    importPending=obj;
    var total=0,parts=[];
    IMPORT_COUNT_KEYS.forEach(function(k){
      var n=Array.isArray(obj[k])?obj[k].length:0;total+=n;
      if(n>0)parts.push(k+" "+n+" 条");
    });
    modal("导入恢复 · 预览",
      '<p class="small" style="margin:0 0 8px">这份备份里共有 <b>'+total+'</b> 条主要记录。</p>'
      +'<p class="small dim" style="margin:0 0 12px">合并：与现在的记录按条合并（同一条取较新的一份，删除记录不复活）。覆盖：整份换成备份内容，现在的记录会被替换。</p>'
      +'<div class="row wrap"><button type="button" class="pix-btn pix-btn-green" data-act="import-merge" aria-label="合并导入">合并导入</button>'
      +'<button type="button" class="pix-btn pix-btn-red" data-act="import-overwrite" aria-label="覆盖导入">覆盖导入</button>'
      +'<button type="button" class="pix-btn pix-btn-ghost" data-act="modal-close" aria-label="取消导入">取消</button></div>');
  };
  reader.readAsText(file);
}

var comp={char:isCharId(S.profile.companion)?S.profile.companion:"sebastian",line:"",shown:"",battery:100,seed:7,open:false,pos:null,timer:null,moodSeen:"",drag:null};
function compDims(){var desktop=window.innerWidth>=900;var h=desktop?84:64;return{h:h,w:Math.round(h*32/48)};}
function compBox(){var d=compDims();return{w:d.w+16,h:d.h+12};}
function loadCompPos(){
  try{var raw=localStorage.getItem("seb-pos-v1");if(raw){var v=JSON.parse(raw);if(typeof v.x==="number"&&typeof v.y==="number")return v;}}catch(e){}
  return null;
}
function clampCompPos(p){var b=compBox();return{x:Math.max(0,Math.min(p.x,window.innerWidth-b.w)),y:Math.max(0,Math.min(p.y,window.innerHeight-b.h))};}
function compPackOwned(c){return S.goldOwned.indexOf("pack_"+c)>=0;}
function compPack2Owned(c){return S.goldOwned.indexOf("pack2_"+c)>=0;}
function compMerchantPackOwned(c){return (S.merchantOwned||[]).indexOf("pack_tm_"+c)>=0;}
function companionSpeak(text){
  comp.line=text;comp.shown="";comp.open=true;
  if(comp.timer)clearInterval(comp.timer);
  var i=0;
  comp.timer=setInterval(function(){i++;comp.shown=text.slice(0,i);var el=document.getElementById("comp-line");if(el)el.innerHTML=esc(comp.shown)+(comp.shown.length<text.length?"▌":"");if(i>=text.length){clearInterval(comp.timer);comp.timer=null;}},34);
  renderCompanion();
}
function companionSay(scene){
  comp.seed+=11;
  companionSpeak(pickCharLineOwned(comp.char,scene,Date.now()%997,compPackOwned(comp.char),compPack2Owned(comp.char),compMerchantPackOwned(comp.char)));
}
function companionCongrats(){
  var pool=CONGRATS_LINES[comp.char];
  companionSpeak(pool[Math.floor(Math.random()*pool.length)]||pool[0]);
}
function renderCompanion(){
  var root=document.getElementById("companion-root");
  var d=compDims();var b=compBox();
  if(!comp.pos){var stored=loadCompPos();comp.pos=stored?clampCompPos(stored):clampCompPos({x:window.innerWidth-b.w-10,y:window.innerHeight-b.h-14});}
  var bubbleLeft=comp.pos.x>window.innerWidth/2;
  var name=charName(comp.char);
  var bubble="";
  if(comp.open){
    bubble='<div class="bubble" role="dialog" aria-label="'+name+'的对话框" style="bottom:'+(b.h+4)+"px;"+(bubbleLeft?"right:0":"left:0")+'">'
      +'<div style="display:flex;align-items:center;gap:8px"><span>'+spriteWithAcc(comp.char,48)+'</span><span class="font-pixel" style="line-height:1.3">'+name+'</span>'
      +'<button type="button" class="pix-btn pix-btn-ghost" style="min-height:26px;padding:1px 7px;margin-left:auto" data-act="comp-close" aria-label="收起对话框">×</button></div>'
      +'<p class="small" id="comp-line" aria-live="polite" style="margin:4px 0 0;line-height:1.45;min-height:40px">'+esc(comp.shown)+(comp.shown.length<comp.line.length?"▌":"")+"</p>"
      +'<div style="margin-top:4px;display:flex;align-items:center;gap:8px" aria-label="社交电量 '+comp.battery+'%"><span class="xs">电量</span><div style="height:8px;flex:1;background:#e8dcc0;border:2px solid #4a2c14"><div style="width:'+comp.battery+'%;height:100%;background:'+(comp.battery>30?"#5da33c":"#e13b3b")+';transition:width .4s"></div></div><span class="font-num" style="font-size:10px">'+comp.battery+"</span></div>"
      +'<div style="margin-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px"><p class="xs dim" style="margin:0">拖动挪位置，点一下说话。</p>'
      +'<button type="button" class="pix-btn" style="min-height:30px;padding:2px 10px;font-size:13px" data-act="comp-choose" aria-label="换一个小伙伴">换人</button></div></div>';
  }
  root.innerHTML='<div id="companion" style="left:'+comp.pos.x+"px;top:"+comp.pos.y+"px;width:"+b.w+"px;height:"+b.h+'px">'
    +bubble
    +'<button type="button" id="comp-btn" aria-label="'+name+'：拖动移动，点一下说话" style="display:block;cursor:grab;background:transparent;border:0;padding:6px;margin:0 auto;touch-action:none"><span class="floaty" style="display:block;pointer-events:none">'+spriteWithAcc(comp.char,d.h)+"</span></button></div>";
  var btn=document.getElementById("comp-btn");
  btn.addEventListener("pointerdown",compPointerDown);
  btn.addEventListener("pointermove",compPointerMove);
  btn.addEventListener("pointerup",compPointerUp);
}
function compPointerDown(e){
  comp.drag={sx:e.clientX,sy:e.clientY,ox:comp.pos.x,oy:comp.pos.y,moved:false};
  if(e.target.setPointerCapture)try{e.target.setPointerCapture(e.pointerId);}catch(err){}
}
function compPointerMove(e){
  var dr=comp.drag;if(!dr)return;
  var dx=e.clientX-dr.sx,dy=e.clientY-dr.sy;
  if(Math.abs(dx)+Math.abs(dy)>6)dr.moved=true;
  if(dr.moved){comp.pos=clampCompPos({x:dr.ox+dx,y:dr.oy+dy});var el=document.getElementById("companion");if(el){el.style.left=comp.pos.x+"px";el.style.top=comp.pos.y+"px";}}
}
function compPointerUp(){
  var dr=comp.drag;comp.drag=null;if(!dr)return;
  if(dr.moved){try{localStorage.setItem("seb-pos-v1",JSON.stringify(comp.pos));}catch(e){} renderCompanion();}
  else compTap();
}
function compTap(){
  comp.battery=Math.max(10,comp.battery-8);
  sebClickRecord();
  comp.seed+=13;var s=comp.seed;
  if(comp.battery<=25){companionSpeak(LOW_BATTERY_LINES[comp.char]);return;}
  var today=todayStr();var tm=null;S.moods.forEach(function(m){if(m.date===today)tm=m;});
  if(tm){
    var key=tm.date+"|"+comp.char+"|"+tm.mood;
    if(comp.moodSeen!==key){
      comp.moodSeen=key;
      var ml=(MOOD_LINES[comp.char]||{})[tm.mood];
      if(ml){companionSpeak(ml);return;}
    }
  }
  var linePage=(ui.page==="regions"||ui.page==="regionDetail")?"workToday":(ui.page==="calendar"?(ui.calSpace==="work"?"workToday":"life"):ui.page);
  if(s%4!==3){
    var pst=pageStatus(linePage);
    /* 低落日全天温和门：pageStatus 的分档只作统计，低落日不得据此抽 urgent 催促台词，强制走 normal 温和池 */
    if(lowMoodDay()&&pst==="urgent")pst="normal";
    var pl=pickPageLine(linePage,pst,comp.char,s);
    if(pl){companionSpeak(pl);return;}
  }
  companionSpeak(pickCharLineOwned(comp.char,sebSceneForHour(new Date().getHours()),s,compPackOwned(comp.char),compPack2Owned(comp.char),compMerchantPackOwned(comp.char)));
}

/* 像素字：低分辨率画布绘字（硬描边 + 硬偏移实色阴影），再以最近邻放大 */
function pixelTextUrl(text,colors,fs){
  fs=fs||22;
  var font='700 '+fs+'px "Microsoft YaHei","PingFang SC",sans-serif';
  var meas=document.createElement("canvas").getContext("2d");meas.font=font;
  var w=0;for(var i=0;i<text.length;i++)w+=Math.ceil(meas.measureText(text[i]).width);
  var cv=document.createElement("canvas");cv.width=w+10;cv.height=fs+12;
  var ctx=cv.getContext("2d");ctx.font=font;ctx.textBaseline="middle";ctx.lineJoin="miter";
  var x=5,y=cv.height/2+1;
  ctx.fillStyle=colors.shadow;ctx.fillText(text,x,y+3);
  ctx.lineWidth=4;ctx.strokeStyle=colors.outline;ctx.strokeText(text,x,y);
  ctx.fillStyle=colors.fill;ctx.fillText(text,x,y);
  return cv.toDataURL("image/png");
}

  var s='<svg width="100%" height="54" viewBox="0 0 120 12" preserveAspectRatio="none" shapeRendering="crispEdges" aria-hidden="true" focusable="false" style="display:block">';
  back.forEach(function(r){s+='<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+g[1]+'"/>';});
  front.forEach(function(r){s+='<rect x="'+r[0]+'" y="'+r[1]+'" width="'+r[2]+'" height="'+r[3]+'" fill="'+g[0]+'"/>';});

/* 重绘保留滚动位置；只有切页才回顶部 */
/* 同步重绘不打断正在编辑的表单：重绘前记下页面内正聚焦的输入框内容与光标，重绘后原样恢复 */
function captureEditState(){
  var a=document.activeElement;
  if(!a||(a.tagName!=="INPUT"&&a.tagName!=="TEXTAREA"))return null;
  if(a.id==="memo-q"||a.id==="study-q"||(a.dataset&&a.dataset.input))return null;
  var page=document.getElementById("page");
  if(!page||!page.contains(a))return null;
  var form=a.closest?a.closest("form"):null;
  var start=null;try{start=a.selectionStart;}catch(e){}
  return{name:a.name||"",id:a.id||"",formKind:form?form.dataset.form:"",value:a.value,start:start};
}
function restoreEditState(cap){
  if(!cap)return;
  var sel=null;
  if(cap.id)sel=document.getElementById(cap.id);
  if(!sel&&cap.name&&cap.formKind){var f=document.querySelector('form[data-form="'+cap.formKind+'"]');if(f&&f.elements[cap.name])sel=f.elements[cap.name];}
  if(!sel)return;
  if(sel.value!==cap.value)sel.value=cap.value;
  sel.focus();
  if(cap.start!=null){try{sel.setSelectionRange(cap.start,cap.start);}catch(e){}}
}

  renderHud();renderSidebar();renderDrawer();renderPage();renderFx();renderJunimoLayer();renderNoteLayer();
  if(keepScroll)window.scrollTo(0,y);
  restoreEditState(cap);
  lastRenderPage=ui.page;
}

/* ============ HUD 滚动收缩（细条） ============ */
/* 迟滞：下滑超过 40px 才收起、回到 6px 以内才展开，中间区间保持当前状态，避免临界点反复伸缩。
   只切 class、不触发 render，不干扰 render() 的滚动位置保留；状态挂在 header/body 上，renderHud 重绘不丢。 */
var hudSlimState=false;
var hudHeaderEl=document.querySelector(".app-header");
function hudOnScroll(){
  if(!hudHeaderEl)hudHeaderEl=document.querySelector(".app-header");
  if(!hudHeaderEl)return;
  var y=window.scrollY||document.documentElement.scrollTop||0;
  if(!hudSlimState&&y>40){
    hudSlimState=true;
    hudHeaderEl.classList.add("hud-slim");
    document.body.classList.add("hud-slim");
  }else if(hudSlimState&&y<=6){
    hudSlimState=false;
    hudHeaderEl.classList.remove("hud-slim");
    document.body.classList.remove("hud-slim");
  }
}
window.addEventListener("scroll",hudOnScroll,{passive:true});

/* 日历周视图桌面端拖动改期：拖待办改 date；拖工作事项只改 planDate，永不动 dueDate；
   已完成项与历史记录不带 draggable 属性，拖不动。手机端用每条事项的日期选择入口改期。 */
var calDrag=null;
document.addEventListener("dragstart",function(e){
  var el=e.target.closest?e.target.closest("[data-drag-kind]"):null;
  calDrag=el?{kind:el.dataset.dragKind,id:Number(el.dataset.dragId)}:null;
  if(el&&e.dataTransfer){try{e.dataTransfer.setData("text/plain",el.dataset.dragKind+":"+el.dataset.dragId);e.dataTransfer.effectAllowed="move";}catch(err){}}
});
document.addEventListener("dragover",function(e){
  if(!calDrag)return;
  var cell=e.target.closest?e.target.closest("[data-drop-date]"):null;
  if(cell){e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect="move";}
});
document.addEventListener("drop",function(e){
  if(!calDrag)return;
  var cell=e.target.closest?e.target.closest("[data-drop-date]"):null;
  var d=calDrag;calDrag=null;
  if(!cell)return;
  e.preventDefault();
  var date=cell.dataset.dropDate;
  if(d.kind==="todo"){
    var t=findById(S.todos,d.id);
    if(t&&!t.done&&t.date!==date)mutate(function(){saveTodoEdit(d.id,t.text,date);});
  }else if(d.kind==="work"){
    var w=findById(S.workItems,d.id);
    if(w&&!w.done&&planDayOf(w)!==date)mutate(function(){saveWorkItem(d.id,{kind:w.kind,title:w.title,district:w.district,dueDate:w.dueDate,planDate:date,estMinutes:w.estMinutes,outing:w.outing,difficulty:w.difficulty,note:w.note,category:w.category,location:w.location,subtasks:w.subtasks});});
  }
});
document.addEventListener("dragend",function(){calDrag=null;});
function syncWorkFormToState(){
  if(!workEditState)return;
  var f=document.querySelector('form[data-form="work-save"]');if(!f)return;
  var ed=workEditState.editing;
  ed.title=f.title.value;ed.dueDate=f.dueDate.value;if(f.planDate)ed.planDate=f.planDate.value;ed.estMinutes=f.estMinutes.value;ed.note=f.note.value;
  if(f.district)ed.district=f.district.value;
  if(f.category)ed.category=f.category.value;
  if(f.location)ed.location=f.location.value;
}
function renderSplashKeep(){/* 标题屏已关闭时不重挂；未关闭时换木牌样式 */
  var sp=document.getElementById("splash");
  if(sp)renderSplash();
}
document.addEventListener("change",function(e){
  var el=e.target.closest?e.target.closest("[data-change]"):null;
  if(el){
    var kind=el.dataset.change;
    if(kind==="plan-date"){ui.planDate=el.value;ui.planFollow=(el.value===todayStr());render();}
    else if(kind==="review-date"){ui.reviewDate=el.value;ui.reviewFollow=(el.value===todayStr());render();}
    else if(kind==="news-date"){ui.newsDate=el.value;ui.newsFollow=(el.value===todayStr());render();}
    else if(kind==="cal-move-todo"){
      /* 手机端改期入口：待办改它自己的 date */
      var ct=findById(S.todos,Number(el.dataset.id));
      if(ct&&el.value&&el.value!==ct.date)mutate(function(){saveTodoEdit(ct.id,ct.text,el.value);});}
    else if(kind==="cal-move-work"){
      /* 手机端改期入口：工作事项只改 planDate（办理日），永不动 dueDate */
      var cw=findById(S.workItems,Number(el.dataset.id));
      if(cw&&el.value)mutate(function(){saveWorkItem(cw.id,{kind:cw.kind,title:cw.title,district:cw.district,dueDate:cw.dueDate,planDate:el.value,estMinutes:cw.estMinutes,outing:cw.outing,difficulty:cw.difficulty,note:cw.note,category:cw.category,location:cw.location,subtasks:cw.subtasks});});}
    else if(kind==="fin-month"){ui.finMonth=el.value;render();}
    else if(kind==="habit-target"){ui.habitForm.target=Number(el.value);}
    else if(kind==="cycle-type"){
      var cf1=el.closest?el.closest("form"):null;
      if(cf1){var ce=cf1.elements;
        ui.cycleForm.name=ce.name.value;ui.cycleForm.category=ce.category.value;
        if(ce.n)ui.cycleForm.n=Number(ce.n.value)||1; if(ce.dow)ui.cycleForm.dow=Number(ce.dow.value);
        if(ce.day)ui.cycleForm.day=Number(ce.day.value)||1; if(ce.month)ui.cycleForm.month=Number(ce.month.value)||1;
        ui.cycleForm.dueDate=ce.dueDate.value;ui.cycleForm.remind=ce.remind.value;
        if(ce.supply)ui.cycleForm.supply=ce.supply.value;}
      ui.cycleForm.type=el.value;render();}
    else if(kind==="cycle-edit-type"){
      syncCycleFormToState();if(!cycleEditState)return;
      cycleEditState.vals.type=el.value;cycleEditorModal();}
    else if(kind==="work-status"){ui.workList[el.dataset.kind].status=el.value;render();}
    else if(kind==="work-soon"){ui.workList[el.dataset.kind].soon=el.checked;render();}
    else if(kind==="subtask"){
      var w=findById(S.workItems,Number(el.dataset.id));if(!w)return;
      var idx=Number(el.dataset.idx);
      var next=w.subtasks.map(function(t,ti){return ti===idx?{text:t.text,done:!t.done,sid:t.sid}:t;});
      mutate(function(){saveWorkItem(w.id,{kind:"office",title:w.title,district:null,dueDate:w.dueDate,planDate:w.planDate||null,estMinutes:w.estMinutes,outing:false,difficulty:w.difficulty,note:w.note,category:w.category,location:"",subtasks:next});});
    }
    return;
  }
  if(e.target.id==="fin-file"&&e.target.files&&e.target.files[0]){handleFinanceImport(e.target.files[0]);e.target.value="";}
  if(e.target.id==="import-file"&&e.target.files&&e.target.files[0]){handleImportFile(e.target.files[0]);e.target.value="";}
});
/* 搜索框：输入法 composition 守卫 + 约 180ms 防抖，拼音输入不被全量重绘打断 */
var searchTimers={};
function queueSearchRender(el){
  if(!el||(el.dataset&&el.dataset.composing==="1"))return;
  var key=el.id||("q:"+(el.dataset?el.dataset.input:"")+":"+(el.dataset?el.dataset.kind:""));
  if(searchTimers[key])clearTimeout(searchTimers[key]);
  searchTimers[key]=setTimeout(function(){
    var pos=null;try{pos=el.selectionStart;}catch(err){}
    render();
    var nq=el.id?document.getElementById(el.id):document.querySelector('[data-input="'+el.dataset.input+'"][data-kind="'+el.dataset.kind+'"]');
    if(nq){nq.focus();if(pos!=null){try{nq.setSelectionRange(pos,pos);}catch(err){}}}
  },180);
}
document.addEventListener("compositionstart",function(e){if(e.target&&e.target.dataset)e.target.dataset.composing="1";});
document.addEventListener("compositionend",function(e){if(e.target&&e.target.dataset){e.target.dataset.composing="";queueSearchRender(e.target);}});
document.addEventListener("input",function(e){
  if(e.target.id==="memo-q"){ui.memoQ=e.target.value;queueSearchRender(e.target);}
  if(e.target.id==="study-q"){ui.studyQ=e.target.value;queueSearchRender(e.target);}
  if(e.target.id==="global-q"){renderGlobalResults();}
  if(e.target.id==="mood-note"){ui.moodNoteDraft=e.target.value;}
  if(e.target.dataset&&e.target.dataset.input==="work-q"){
    ui.workList[e.target.dataset.kind].q=e.target.value;queueSearchRender(e.target);
  }
  /* 备忘编辑草稿自动存（与托管版同一键名习惯） */
  var mf=e.target.closest?e.target.closest('form[data-form="memo-save"]'):null;
  if(mf){
    var idv=mf.id.value;
    if(!idv){
      try{localStorage.setItem("desk-draft-memo-new",JSON.stringify({title:mf.title.value,content:mf.content.value,tag:mf.tag.value}));}catch(err){}
    }
  }
  /* 复盘长文本草稿：边打边存，切页/同步重绘回来还在 */
  var rf=e.target.closest?e.target.closest('form[data-form="review-save"]'):null;
  if(rf&&rf.elements.g&&rf.elements.s&&rf.elements.r){
    draftSet("review:"+(ui.reviewDate||todayStr()),{g:rf.elements.g.value,s:rf.elements.s.value,r:rf.elements.r.value});
  }
  /* 学习记录输入草稿：按主题存，打了一半切走不丢 */
  var sf=e.target.closest?e.target.closest('form[data-form="study-log"]'):null;
  if(sf&&sf.elements.content){
    draftSet("studylog:"+sf.dataset.id,sf.elements.content.value);
  }
});
document.addEventListener("submit",function(e){
  var f=e.target.closest?e.target.closest("form[data-form]"):null;
  if(!f)return;
  e.preventDefault();
  var kind=f.dataset.form;
  var fd=function(n){return f.elements[n]?f.elements[n].value:"";};
  switch(kind){
    case "auth":{
      var lem=fd("email").trim(),lpw=fd("password");
      if(!lem||!lpw){authMsg("先把邮箱和密码填上。",true);break;}
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(lem)){authMsg("邮箱格式好像不对，检查一下。",true);break;}
      doLogin(lem,lpw);break;}
    case "todo-add":{
      var text=fd("text").trim();if(!text)break;
      var dval=fd("date");
      var date=/^\d{4}-\d{2}-\d{2}$/.test(dval)?dval:todayStr();
      mutate(function(){addTodo(text,date);});break;}
    case "todo-quick-add":{
      var qtext=fd("text").trim();if(!qtext)break;
      mutate(function(){addTodo(qtext,todayStr());});break;}
    case "todo-save":{
      var tidv=fd("id")?Number(fd("id")):null;var ttext=fd("text").trim();if(tidv==null||!ttext)break;
      closeModal();
      mutate(function(){saveTodoEdit(tidv,ttext,fd("date")||null);});break;}
    case "review-save":{
      var date=ui.reviewDate||todayStr();
      var rg=fd("g"),rs=fd("s"),rr=fd("r");
      mutate(function(){
        saveReview(date,rg,rs,rr);
        draftClear("review:"+date);
        /* 复盘联动：这一天有「感恩日记」锚点时，保存复盘即视为完成，不用再去今日页勾一次 */
        anchorsForDate(date).forEach(function(a){
          if(a.text.indexOf("感恩")>=0&&anchorStatus(a.id,date)!=="done")setAnchorStatus(a.id,date,"done");
        });
      });break;}
    case "memo-quick":{
      var text=fd("text").trim();if(!text)break;
      var title=text.length>24?text.slice(0,24)+"…":text;
      mutate(function(){saveNote(null,title,text,"灵感");});break;}
    case "memo-save":{
      var idv=fd("id");var id=idv?Number(idv):null;
      var title=fd("title"),content=fd("content"),tg=fd("tag");
      closeModal();
      mutate(function(){saveNote(id,title,content,tg);});
      if(id==null){try{localStorage.removeItem("desk-draft-memo-new");}catch(err){}}
      break;}
    case "study-save":{
      var idv2=fd("id");
      var cmEl=f.elements.courseMode;
      var dlVal=fd("deadline");
      var extra={nextTry:fd("nextTry").trim(),courseMode:!!(cmEl&&cmEl.checked),chapter:fd("chapter").trim(),progressPct:Math.max(0,Math.min(100,Number(fd("progressPct"))||0)),deadline:/^\d{4}-\d{2}-\d{2}$/.test(dlVal)?dlVal:null};
      closeModal();
      mutate(function(){saveStudyTopic(idv2?Number(idv2):null,fd("title"),fd("status"),fd("notes"),extra);});break;}
    case "curiosity-add":{
      var ctext=fd("text").trim();if(!ctext)break;
      mutate(function(){addCuriosity(ctext);});break;}
    case "study-log":{
      var tid=Number(f.dataset.id);
      var skind=fd("kind")||"note";
      var scontent=fd("content").trim();
      var surl=fd("url").trim();
      if(!scontent&&!(skind==="link"&&/^https?:\/\//i.test(surl)))break;
      mutate(function(){draftClear("studylog:"+tid);addStudyLog(tid,scontent,skind,surl);});break;}
    case "workout-add":{
      mutate(function(){addWorkout(fd("type"),Number(fd("minutes"))||0,fd("note"),fd("date")||todayStr());});break;}
    case "cal-workout-add":{
      /* 日历里运动锚点的「记一笔健身」：走到这一步才是用户确认过，确认才生成健身记录 */
      closeModal();
      mutate(function(){addWorkout(fd("type"),Number(fd("minutes"))||0,fd("note"),fd("date")||todayStr());});break;}
    case "workout-save":{
      var widv=fd("id")?Number(fd("id")):null;if(widv==null)break;
      closeModal();
      mutate(function(){saveWorkout(widv,{type:fd("type"),minutes:Number(fd("minutes"))||0,note:fd("note"),date:fd("date")||todayStr()});});break;}
    case "fin-add":{
      var amt=Number(fd("amount"));var title=fd("title").trim();
      if(!title||!(amt>0))break;
      mutate(function(){addFinanceTx(fd("date")||todayStr(),title,fd("category"),amt,fd("kind"));});break;}
    case "goal-save":{
      closeModal();
      mutate(function(){saveSavingsGoal(fd("id")?Number(fd("id")):null,fd("name"),Number(fd("target")),Number(fd("saved")));});break;}
    case "habit-add":{
      var nameEl=f.elements.name;var name=nameEl.value.trim();if(!name)break;
      var hf=ui.habitForm;
      mutate(function(){addHabit(name,hf.icon,hf.kind,hf.target);});
      ui.habitForm.name="";break;}
    case "anchor-add":{
      var atext=fd("text").trim();if(!atext)break;
      var af=ui.anchorForm;
      var adays=af.mode==="weekly"?(af.days.length?af.days.slice():[1]):null;
      mutate(function(){saveAnchor(null,{text:atext,time:fd("time"),note:fd("note").trim(),days:adays});});break;}
    case "anchor-save":{
      var aid=fd("id")?Number(fd("id")):null;
      var sdays=anchorEditState?anchorEditState.days:null;
      closeModal();
      mutate(function(){saveAnchor(aid,{text:fd("text").trim(),time:fd("time"),note:fd("note").trim(),days:sdays});});
      anchorEditState=null;break;}
    case "cycle-add":{
      var cname=fd("name").trim();if(!cname)break;
      var cvals={name:cname,category:fd("category").trim()||"其他",type:fd("type")||"days",
        n:Number(fd("n"))||1,dow:Number(fd("dow"))||0,day:Number(fd("day"))||1,month:Number(fd("month"))||1,
        nextDue:fd("dueDate")||todayStr(),remindDays:Math.max(0,Number(fd("remind"))||0),supply:fd("supply").trim()};
      mutate(function(){addCycle(cvals);});
      ui.cycleForm={type:ui.cycleForm.type,catSel:"全屋清洁"};break;}
    case "cycle-save":{
      var cid=fd("id")?Number(fd("id")):null;
      var svals={name:fd("name").trim(),category:fd("category").trim()||"其他",type:fd("type")||"days",
        n:Number(fd("n"))||1,dow:Number(fd("dow"))||0,day:Number(fd("day"))||1,month:Number(fd("month"))||1,
        nextDue:fd("dueDate")||todayStr(),remindDays:Math.max(0,Number(fd("remind"))||0),supply:fd("supply").trim()};
      closeModal();
      mutate(function(){if(cid!=null)saveCycle(cid,svals);});
      cycleEditState=null;break;}
    case "shop-add":{
      var sname=fd("name").trim();if(!sname)break;
      mutate(function(){addShopItem(sname,fd("qty").trim());});break;}
    case "shop-save":{
      var sid=fd("id")?Number(fd("id")):null;var sname2=fd("name").trim();if(!sname2)break;
      closeModal();
      mutate(function(){if(sid!=null)saveShopItem(sid,sname2,fd("qty").trim());});break;}
    case "district-add":{
      var nm=fd("name").trim();if(!nm)break;
      mutate(function(){addDistrict(nm);});break;}
    case "work-save":{
      var wk=f.dataset.kind;
      var subtasks=[];
      if(wk==="office"){
        /* 子任务带稳定 sid：保存时按 sid 合并勾选状态，改文字不丢勾选 */
        subtasks=Array.prototype.map.call(f.querySelectorAll(".subtask-input"),function(inp){return{text:inp.value,done:false,sid:inp.dataset.sid?Number(inp.dataset.sid):uid()};}).filter(function(t){return t.text.trim();});
        if(workEditState&&workEditState.editing.id!=null){
          var old=findById(S.workItems,workEditState.editing.id);
          if(old){
            var doneBySid={};(old.subtasks||[]).forEach(function(x){if(x.sid!=null)doneBySid[x.sid]=!!x.done;});
            subtasks=subtasks.map(function(t){return{text:t.text,done:!!doneBySid[t.sid],sid:t.sid};});
          }
        }
      }
      var vals={kind:wk,title:fd("title"),
        district:wk==="office"?null:fd("district"),
        dueDate:fd("dueDate")||null,
        planDate:fd("planDate")||null,
        estMinutes:fd("estMinutes")?Number(fd("estMinutes")):30,
        outing:wk!=="office",difficulty:2,note:fd("note"),
        category:wk==="office"?fd("category"):"",
        location:wk==="cert"?fd("location"):"",
        subtasks:subtasks};
      var idv3=fd("id");
      closeModal();workEditState=null;
      mutate(function(){saveWorkItem(idv3?Number(idv3):null,vals);});break;}
    case "reward-save":{
      closeModal();
      mutate(function(){saveReward(fd("id")?Number(fd("id")):null,fd("name"),Number(fd("cost"))||1,fd("icon"));});break;}
    case "friend-save":{
      var frname=fd("name").trim();if(!frname)break;
      var frmon=Math.min(12,Math.max(1,Number(fd("birthMonth"))||1));
      var frday=Math.min(31,Math.max(1,Number(fd("birthDay"))||1));
      var frby=Number(fd("birthYear"))||null;
      var frvals={name:frname,avatar:fd("avatar")||"farmer",calType:fd("calType")==="lunar"?"lunar":"solar",
        birthMonth:frmon,birthDay:frday,birthYear:frby,
        relation:fd("relation").trim(),likes:fd("likes").trim(),giftIdeas:fd("giftIdeas").trim(),note:fd("note").trim()};
      var frid=fd("id")?Number(fd("id")):null;
      closeModal();
      mutate(function(){saveFriend(frid,frvals);});break;}
    case "profile-save":{
      var split=function(s){return s.split(/[，,、\n]/).map(function(x){return x.trim();}).filter(Boolean);};
      closeModal();
      mutate(function(){
        S.profile.name=fd("name");S.profile.avatarEmoji=fd("avatarEmoji");S.profile.bio=fd("bio");
        S.profile.birthdaySeason=fd("birthdaySeason");S.profile.birthdayDay=Math.min(28,Math.max(1,Number(fd("birthdayDay"))||1));
        S.profile.loves=split(fd("loves"));S.profile.hates=split(fd("hates"));
        S.profile.petName=fd("petName");S.profile.petEmoji=fd("petEmoji");touchProfile();
      });break;}
  }
});

/* ============ 初始化 ============ */
if(!ui.planDate)ui.planDate=todayStr();
if(!ui.reviewDate)ui.reviewDate=todayStr();
if(!ui.newsDate)ui.newsDate=todayStr();
if(!ui.moodMonth)ui.moodMonth=todayStr().slice(0,7);
if(!ui.finMonth)ui.finMonth=todayStr().slice(0,7);
render();
renderCompanion();
updateSyncBadge();
bootGate();
/* 每 30 秒检查一次跨天：跨天自动按新的一天重绘并提示 */
var bootDay=todayStr();
setInterval(function(){
  var t=todayStr();
  if(t!==bootDay){
    var oldDay=bootDay;bootDay=t;
    /* 跨天日期跟随：停留在「今天」语义的日期自动跟到新一天；用户主动选的历史日期保持不动 */
    if(ui.planFollow&&ui.planDate===oldDay)ui.planDate=t;
    if(ui.reviewFollow&&ui.reviewDate===oldDay)ui.reviewDate=t;
    if(ui.newsFollow&&ui.newsDate===oldDay)ui.newsDate=t;
    render();pushBanners([{icon:"sun",title:"新的一天开始了",sub:t+" · 已按今天刷新",small:true}]);
  }
},30000);
